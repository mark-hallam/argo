[package]
name = "argo-mcp-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — voice MCP server (§28.Z, schema + dispatcher; native bindings land in a follow-up)"

[[bin]]
name = "argo-mcp-voice"
path = "src/main.rs"

[dependencies]
argo-mcp = { path = "../../crates/argo-mcp", version = "0.0.1" }
argo-types = { path = "../../crates/argo-types", version = "0.0.1" }
async-trait = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
default = []
# Opt-in: pull in whisper-rs (whisper.cpp Rust bindings) for the
# `backend="whisper"` STT path. Heavy native build (C++ +
# CMake), so default-off — users who want native STT compile
# with `--features whisper-native` once the dep is wired.
whisper-native = []
# Opt-in: pull in piper-rs for the `backend="piper"` TTS path.
# Same caveat as whisper-native — heavy native build, opt-in.
piper-native = []
# Convenience: enable both native bindings at once.
native = ["whisper-native", "piper-native"]
