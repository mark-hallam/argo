[package]
name = "argo-mcp-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — voice MCP server (§28.Z); cloud backends shipped, opt-in native bindings via `whisper-native` / `piper-native` features"

[[bin]]
name = "argo-mcp-voice"
path = "src/main.rs"

[dependencies]
argo-mcp = { path = "../../crates/argo-mcp", version = "0.0.1" }
argo-types = { path = "../../crates/argo-types", version = "0.0.1" }
async-trait = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Optional native voice deps. Gated behind feature flags so the
# default build stays cheap (cloud-only). Pulling these in adds
# ~50–90 sec to a fresh build (C++/CMake compile step) plus
# ~20 MB to the resulting binary — that's why they're opt-in
# rather than default-on.
whisper-rs = { version = "0.16", optional = true }
# `hound` decodes 16-kHz mono WAV files into f32 samples for
# whisper. Tiny pure-Rust crate — only pulled when whisper-native
# is enabled.
hound = { version = "3", optional = true }

[features]
default = []
# Opt-in: pull in whisper-rs (whisper.cpp Rust bindings) for the
# `backend="whisper"` STT path. Heavy native build (C++ +
# CMake) — users who want native STT compile with
# `--features whisper-native`. Also pulls `hound` for WAV
# decoding.
whisper-native = ["dep:whisper-rs", "dep:hound"]
# Opt-in placeholder: piper-native is reserved for when piper-rs
# upstream stabilises against current `ort`. As of #636, piper-rs
# 0.1.9 fails to compile against ort 2.x (`Shape::view()` was
# removed). The `backend="piper"` path stays cfg-gated and the
# `backend="local"` shell-out (set ARGO_SYNTHESIZE_CMD to your
# `piper` binary) is the recommended native TTS path today.
piper-native = []
# Convenience: enable every native binding that currently works.
native = ["whisper-native"]
