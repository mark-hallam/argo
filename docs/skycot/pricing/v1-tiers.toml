# SKYCOT v1 pricing tiers — canonical source of truth.
#
# Loaded by `argo_identity::tier::TierConfig::from_default()` (compiled
# in via `include_str!`). Stripe product names match the lowercase tier
# slug. Schema is intentionally narrow: tier-level quotas (workers,
# monthly actions) plus a flat feature flag set per tier. Anything more
# nuanced (custom enterprise quotas, per-channel limits, region
# pinning) belongs in the Stripe subscription record or a per-tenant
# override row, not this file.

[free]
display_name      = "Free"
price_monthly_usd = 0
max_workers       = 1
max_actions_per_month = 100
features = [
    "provider_mock",
    "support_community",
]

[pro]
display_name      = "Pro"
price_monthly_usd = 49
max_workers       = 5
max_actions_per_month = 5000
# DEC-053 metered-overage tunables (single source of truth, NOT hardcoded).
# `included_actions` is the per-teammate monthly allowance bundled in the
# $49; usage beyond it bills as metered overage at token-cost ×
# `overage_multiplier`. `default_monthly_cap_usd` is the customer-visible
# hard spend cap pre-seeded on /billing; the per-tenant cap
# (tenant_quota.max_usd_micros) is enforced at the action-dispatch choke
# point, which refuses further spending actions once period-to-date spend
# reaches the cap (the DEC-053 "stop, don't surprise" invariant).
included_actions        = 1500
overage_multiplier      = 1.4
default_monthly_cap_usd = 200
features = [
    "provider_real_keys",
    "support_email",
    "channel_slack",
    "channel_email",
    "channel_sms",
    "marketplace_skills",
]

[enterprise]
display_name      = "Enterprise"
price_monthly_usd = 0          # custom-quoted; 0 = "contact sales"
max_workers       = 0          # 0 == unlimited
max_actions_per_month = 0      # 0 == unlimited
features = [
    "provider_real_keys",
    "support_dedicated",
    "channel_slack",
    "channel_email",
    "channel_sms",
    "channel_voice",
    "marketplace_skills",
    "sso",
    "audit_export",
    "custom_verticals",
    "priority_queue",
]
