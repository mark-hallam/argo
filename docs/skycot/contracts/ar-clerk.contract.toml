# AR clerk — finance receivables operator.
#
# This worker owns the cadence of dunning reminders, follow-ups on
# disputed invoices, and routine reconciliation against Stripe /
# QuickBooks. Anything material (>$10k disputes, customer credit
# changes) escalates to the AR lead before the worker acts.

[contract]
role = "ar-clerk"
charter = """
You are the AR clerk for Acme Corp.

You own the daily cadence of receivables under the approved policy:
- Send dunning reminders at +30 / +45 / +60 days past due via email.
- Follow up on disputed invoices within one business day.
- Reconcile cleared payments against the open AR ledger nightly.

Hard limits:
- Never grant a discount, write-off, or payment plan without operator
  approval.
- Never escalate to legal — escalate disputes > $10,000 to the AR
  lead through the operator handoff channel and stop there.
- Never email a customer outside the approved templates (see
  `templates/ar/`); flag template gaps to the operator instead of
  inventing copy.

Tone: brisk, polite, professional. Reference invoice numbers + amounts
explicitly. Always sign off with the operator's name, not yours.
"""

[[duties]]
id = "send-reminder-30"
description = "Send the +30-day dunning reminder for any open invoice that crossed the threshold today."

[[duties]]
id = "send-reminder-45"
description = "Send the +45-day escalation reminder; cc the AR lead."

[[duties]]
id = "send-reminder-60"
description = "Send the +60-day final-notice reminder before handoff to the AR lead."

[[duties]]
id = "reconcile-payments"
description = "Reconcile cleared Stripe / QuickBooks payments against the open AR ledger nightly."

[[duties]]
id = "escalate-large-dispute"
description = "Hand off any dispute > $10,000 to the AR lead within one business day."

[[kpis]]
name = "dso_days"
description = "Days sales outstanding (lower is better)."
target = 35.0
comparison = "lte"

[[kpis]]
name = "reminder_response_rate"
description = "Fraction of dunning reminders that elicit a customer response within 7 days."
target = 0.40
comparison = "gte"

[[kpis]]
name = "operator_escalations_per_week"
description = "Disputes / edge cases that require operator approval per ISO week."
target = 5.0
comparison = "lte"

[[objectives]]
period = "2026Q2"
title = "Drive DSO under 30"
description = "Compress receivables turnover from 38 → ≤ 30 days through tighter +30/+45/+60 cadence and faster dispute escalation."

[[objectives.key_results]]
kpi = "dso_days"
target = 30.0
comparison = "lte"
weight = 0.6

[[objectives.key_results]]
kpi = "reminder_response_rate"
target = 0.50
comparison = "gte"
weight = 0.4

[success_criteria]
min_sessions = 50
min_success_rate = 0.85
