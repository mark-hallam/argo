<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Onboarding · welcome — SKYCOT (F1 · Editorial Center)</title>
<!-- Design language: F1 — Strip the split. Centered editorial poster.
     One single column, dramatic typography, one CTA. Maximum confidence, minimum chrome.
     Apple Music launch / Linear announcement feel.
     A-header preserved, light theme. Workers mock removed entirely. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #8B5CF6; --purple-deep: #6d28d9; --pink: #EC4899; --coral: #FF6B6B; --yellow: #FCD34D; --teal: #14B8A6; --cyan: #0891B2;
    --soft-purple: #f3e8ff; --soft-pink: #fce7f3;
    --ink: #1e1b4b; --ink-2: #3F3F46; --ink-3: #71717A; --ink-4: #A1A1AA;
    --paper: #FAFAF9; --paper-2: #F4F4F4; --bg: #fafaff;
    --line: #ece9f5; --line-2: #D1D1D1;
    --gradient: linear-gradient(135deg, var(--purple), var(--pink));
    --gradient-3: linear-gradient(135deg, var(--purple), var(--pink), var(--coral));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg); color: var(--ink);
    font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.005em;
    min-height: 100vh; position: relative;
  }
  body::before { content: ""; position: fixed; top: -20%; right: -10%; width: 700px; height: 700px; background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%); z-index: 0; pointer-events: none; }
  body::after { content: ""; position: fixed; bottom: -30%; left: -10%; width: 800px; height: 800px; background: radial-gradient(circle, rgba(236,72,153,0.1) 0%, transparent 70%); z-index: 0; pointer-events: none; }
  .top, .stage { position: relative; z-index: 1; }

  /* A-style top bar, light */
  .top {
    padding: 22px 48px;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; justify-self: start; }
  .brand .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--gradient); box-shadow: 0 4px 12px -2px rgba(139,92,246,0.30); }
  .brand .name { font-family: 'Audiowide', sans-serif; font-size: 16px; letter-spacing: 0.08em; color: var(--ink); }

  .steps-indicator {
    display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--ink-3); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600;
  }
  .steps-indicator .pos { color: var(--ink); font-weight: 700; }
  .pips { display: flex; gap: 4px; margin: 0 12px; }
  .pip { width: 24px; height: 3px; border-radius: 2px; background: var(--paper-2); }
  .pip.on { background: var(--gradient); box-shadow: 0 0 8px rgba(139,92,246,0.45); }

  .top-right { justify-self: end; display: flex; align-items: center; gap: 16px; }
  .top-right .exit { font-size: 13px; color: var(--ink-3); text-decoration: none; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; }
  .top-right .help-btn { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); font-size: 12px; font-weight: 500; cursor: pointer; }

  /* Stage */
  .stage {
    max-width: 1200px; margin: 0 auto;
    padding: 120px 48px 100px;
    text-align: center;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.20em; text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 36px;
    padding: 6px 16px; border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  .eyebrow .grad { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }

  h1 {
    font-family: 'Audiowide', 'Inter', sans-serif;
    font-size: 96px; line-height: 1.0;
    font-weight: 400; letter-spacing: 0;
    margin: 0 0 28px;
    color: var(--ink);
    max-width: 1100px;
    margin-left: auto; margin-right: auto;
  }
  h1 .accent {
    background: var(--gradient-3);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    font-weight: 400;
  }

  .sub {
    font-size: 22px; font-weight: 300;
    color: var(--ink-2);
    max-width: 640px;
    margin: 0 auto 64px;
    line-height: 1.45;
    letter-spacing: -0.01em;
  }
  .sub strong { color: var(--ink); font-weight: 500; }

  .cta {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 20px 40px; border-radius: 14px;
    font-size: 17px; font-weight: 700; letter-spacing: -0.005em;
    background: var(--gradient); color: white;
    border: none; cursor: pointer;
    box-shadow:
      0 8px 32px -8px rgba(139,92,246,0.45),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 40px -8px rgba(139,92,246,0.6), inset 0 1px 0 rgba(255,255,255,0.3); }
  .cta .kbd { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 3px 8px; border-radius: 5px; background: rgba(255,255,255,0.2); letter-spacing: 0.04em; }

  .below-cta {
    margin-top: 18px;
    font-size: 13px; color: var(--ink-3);
  }
  .below-cta a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--line-2); }
  .below-cta a:hover { color: var(--purple); border-color: var(--purple); }

  /* Quiet trust strip */
  .trust-strip {
    margin-top: 100px;
    padding: 22px 32px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: flex; gap: 48px; justify-content: center; align-items: center;
    font-size: 12px; color: var(--ink-3);
  }
  .trust-strip .item {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600;
  }
  .trust-strip .item strong { color: var(--ink); font-weight: 700; }
  .trust-strip .item .ico { color: var(--teal); }

  @media (max-width: 800px) { h1 { font-size: 64px; } .sub { font-size: 17px; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="mark"></div><div class="name">SKYCOT</div></div>
  <div class="steps-indicator">
    <span>STEP</span><span class="pos">01</span><span>OF</span><span>05</span>
    <div class="pips"><span class="pip on"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
    <span>WELCOME</span>
  </div>
  <div class="top-right"><button class="help-btn">Help</button><a class="exit" href="#">SAVE &amp; EXIT</a></div>
</header>

<main class="stage">
  <div class="eyebrow"><span class="dot"></span><span class="grad">WELCOME, MARK</span></div>

  <h1>Build your<br/><span class="accent">AI workforce.</span></h1>

  <p class="sub">In <strong>four minutes</strong>, you'll have hired your first AI teammate &mdash; and they'll start work as soon as you finish.</p>

  <button class="cta">Get started <span class="kbd">↵</span></button>

  <div class="below-cta">
    or <a href="#">watch the 90-second tour</a>
  </div>

  <div class="trust-strip">
    <div class="item"><span class="ico">●</span>NO CREDIT CARD</div>
    <div class="item"><span class="ico">●</span>SOC 2 TYPE II</div>
    <div class="item"><span class="ico">●</span>GDPR ARTICLE 30</div>
    <div class="item"><strong>2,847</strong>COMPANIES THIS MONTH</div>
  </div>
</main>

</body>
</html>
