name: Docs
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with: { mdbook-version: latest }
      - run: mdbook build docs || true
      - uses: actions/upload-artifact@v4
        with: { name: docs, path: docs/book }
