name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace dependency pinning
        run: scripts/check-version-pinning.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - run: cargo nextest run --workspace --no-fail-fast

  coverage:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }
      - name: Generate LCOV coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --ignore-run-fail
      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            lcov.info
            coverage-summary.txt
      - name: Comment coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- skycot-coverage-summary -->';
            const summary = fs.readFileSync('coverage-summary.txt', 'utf8').trim();
            const body = [
              marker,
              '### Coverage summary',
              '',
              '```text',
              summary,
              '```',
              '',
              'No coverage threshold is enforced by this job.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          line_cov=$(awk '/TOTAL/ { value=$NF } END { print value }' coverage-summary.txt)
          if [ -z "$line_cov" ]; then
            line_cov="unknown"
          fi
          numeric=${line_cov%%%}
          color="#9f9f9f"
          if awk "BEGIN { exit !($numeric >= 80) }"; then
            color="#4c1"
          elif awk "BEGIN { exit !($numeric >= 60) }"; then
            color="#dfb317"
          elif awk "BEGIN { exit !($numeric >= 40) }"; then
            color="#fe7d37"
          elif [ "$line_cov" != "unknown" ]; then
            color="#e05d44"
          fi
          cat > coverage.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="142" height="20" role="img" aria-label="coverage: ${line_cov}">
            <rect width="83" height="20" fill="#555"/>
            <rect x="83" width="59" height="20" fill="${color}"/>
            <text x="41.5" y="14" fill="#fff" font-family="Verdana,Geneva,sans-serif" font-size="11" text-anchor="middle">coverage</text>
            <text x="112.5" y="14" fill="#fff" font-family="Verdana,Geneva,sans-serif" font-size="11" text-anchor="middle">${line_cov}</text>
          </svg>
          SVG
      - name: Upload coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage.svg

  loc-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce 500 LOC per source file
        shell: bash
        run: |
          fails=$(find crates -name '*.rs' -not -path '*/target/*' -exec wc -l {} \; \
                  | awk '$1 > 500 {print}')
          if [ -n "$fails" ]; then
            echo "::error::Files exceeding 500 LOC budget:"
            echo "$fails"
            exit 1
          fi
          echo "All source files within LOC budget."

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - run: cargo deny check
