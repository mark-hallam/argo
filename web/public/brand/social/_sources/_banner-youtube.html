<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SKYCOT YouTube channel art — 2560×1440</title>
<!--
  YouTube channel art. 2560×1440 (16:9 master). Visible "safe area" across
  all devices is the centre 1546×423 region. Wordmark sits inside this safe
  area so it shows on TV (cropped) as well as desktop (full).
  Bleed area carries blob ambience only — no text.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1e1b4b; --paper: #FAFAF7; --violet: #8B5CF6; --cyan: #0891B2; --pink: #EC4899; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; }
  body { width: 2560px; height: 1440px; background: var(--paper); position: relative; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(180px); pointer-events: none; }
  .blob-violet   { width: 1600px; height: 1600px; top: -500px; left: -400px; background: radial-gradient(circle, var(--violet) 0%, transparent 65%); opacity: 0.55; }
  .blob-pink     { width: 1400px; height: 1400px; top: 200px;  right: -320px; background: radial-gradient(circle, var(--pink)   0%, transparent 65%); opacity: 0.45; }
  .blob-cyan     { width: 1100px; height: 1100px; bottom: -400px; left: 38%;  background: radial-gradient(circle, var(--cyan)   0%, transparent 65%); opacity: 0.32; }
  .blob-violet-2 { width:  900px; height:  900px; bottom: -260px; right: 18%; background: radial-gradient(circle, var(--violet) 0%, transparent 65%); opacity: 0.28; }
  /* Mobile-safe area is 1546×423 within 2560×1440. Wordmark sized to fit comfortably
     inside this inner safe zone — visible on TV, desktop, AND mobile without clipping. */
  .stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .wordmark { font-family: 'Audiowide', system-ui; font-size: 240px; line-height: 1; letter-spacing: -0.005em; background: linear-gradient(135deg, var(--violet) 0%, var(--pink) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 1px 0 rgba(30, 27, 75, 0.04); }
</style>
</head>
<body>
  <div class="blob blob-violet"></div>
  <div class="blob blob-pink"></div>
  <div class="blob blob-cyan"></div>
  <div class="blob blob-violet-2"></div>
  <div class="stage"><div class="wordmark">SKYCOT</div></div>
</body>
</html>
