<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SKYCOT YouTube watermark — 150×150 transparent</title>
<!--
  YouTube branding watermark (the "subscribe" overlay corner image).
  150×150 (YouTube's recommended size). Transparent background so it works
  over any video content. White Audiowide "S" with subtle gradient glow.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
  :root { --violet: #8B5CF6; --pink: #EC4899; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 150px; height: 150px; overflow: hidden; background: transparent; }
  body { width: 150px; height: 150px; position: relative; overflow: hidden; }
  .stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .letter {
    font-family: 'Audiowide', system-ui;
    font-size: 120px;
    line-height: 1;
    color: #ffffff;
    text-shadow:
      0 0 24px rgba(139, 92, 246, 0.85),
      0 0 12px rgba(236, 72, 153, 0.65),
      0 2px 4px rgba(0, 0, 0, 0.30);
    transform: translateY(-3px);
  }
</style>
</head>
<body>
  <div class="stage"><div class="letter">S</div></div>
</body>
</html>
