[package]
name = "argo-approve"
version = "0.1.0"
description = "Argo approval app — mobile shell for iOS + Android"
authors = ["SKYCOT contributors"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "argo_approve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
