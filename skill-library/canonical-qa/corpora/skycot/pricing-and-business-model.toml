[[entries]]
id = "business-model-positioning"
prompts = [
  "What's your business model?",
  "How do you make money?",
  "Where does revenue come from?",
  "Explain the business model.",
]
answer = """B2B SaaS — subscription plus usage. The business model is \
the workforce layer, not the model layer. We don't sell tokens; we \
sell teammates that use tokens. As the workforce scales, the platform \
takes a fixed percentage; the provider takes the variable cost."""
declared_claim_classes = ["pricing"]
audience_tags = ["investor", "buyer"]
last_reviewed = "2026-05-25"
review_owner = "founder@example.com"
