# Skycot canonical Q&A — pricing + business model.
#
# Hot-path answers about how Skycot charges, what tiers exist, and
# the deferral pattern for revenue/valuation questions. The
# `valuation` and `revenue` claims map to the P-01 truth-boundary
# policy's Forbid+defer-to-mark refusal — the canonical entries
# render the operator-approved refusal so the gate's defense-in-depth
# layer never has to fire.

[[entries]]
id = "pricing-basics"
prompts = [
  "How much does Skycot cost?",
  "What is the pricing model?",
  "How do you charge?",
  "What does it cost?",
  "Tell me about Skycot pricing.",
]
answer = """Per-worker monthly subscription plus usage-based overage on \
provider tokens above each tier's included pool. Pricing scales \
linearly with worker count; the platform itself doesn't penalize \
growth."""
declared_claim_classes = ["pricing"]
audience_tags = ["buyer", "investor"]
last_reviewed = "2026-05-25"
review_owner = "founder@example.com"

[[entries]]
id = "tier-structure"
prompts = [
  "What tiers do you offer?",
  "What are the pricing tiers?",
  "Do you have a starter plan?",
  "Is there a free tier?",
]
answer = """Three tiers: Solo (1-3 workers, prepaid token pool), Team \
(up to 25 workers, dedicated tenant, SSO), and Enterprise (unlimited \
workers, RBAC, custom truth-boundary policies, dedicated routing). \
No free tier — every account is provisioned with real provider \
credentials."""
declared_claim_classes = ["pricing"]
audience_tags = ["buyer"]
last_reviewed = "2026-05-25"
review_owner = "founder@example.com"

