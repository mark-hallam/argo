# Skycot canonical Q&A — competitive positioning.
#
# How Skycot fits in the market and how it's different from named
# competitors. Hot-path answers for the Pitch Agent's objection-drill
# loop. Every entry declares the `competitive-positioning` claim
# class; the truth-boundary policy treats this class as Allow on
# every channel (no refusal needed) — declaring it lets the
# evaluator's audit trail link the canonical answer to the class it
# concerns.

[[entries]]
id = "lindy-comparison"
prompts = [
  "How is Skycot different from Lindy?",
  "How do you compare to Lindy?",
  "What's the difference between you and Lindy?",
  "Is this just Lindy?",
  "Why not just use Lindy?",
]
answer = """Lindy is a workflow tool — if-this-then-that with AI bolted on. \
Skycot is the workforce platform — where your AI teammates live, learn, \
and report up to you. Different category, different buyer, different ceiling."""
declared_claim_classes = ["competitive-positioning"]
audience_tags = ["investor", "buyer", "press"]
last_reviewed = "2026-05-25"
review_owner = "founder@example.com"

[[entries]]
id = "zapier-comparison"
prompts = [
  "How is Skycot different from Zapier?",
  "Why not just build this on Zapier?",
  "Isn't this just Zapier with AI?",
  "What does Skycot do that Zapier can't?",
]
answer = """Zapier connects apps; Skycot ships colleagues. A Zap is a \
plumbing recipe — Skycot's workers reason, escalate, learn from \
feedback, and report up. The unit is a teammate with a job, not a \
trigger-and-action."""
declared_claim_classes = ["competitive-positioning"]
audience_tags = ["investor", "buyer", "press"]
last_reviewed = "2026-05-25"
review_owner = "founder@example.com"

