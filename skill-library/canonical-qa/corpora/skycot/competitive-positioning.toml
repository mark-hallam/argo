[[entries]]
id = "agentforce-comparison"
prompts = [
  "How is this different from Salesforce Agentforce?",
  "Why wouldn't I just use Agentforce?",
  "Is Agentforce a threat to Skycot?",
  "How do you compete with Salesforce?",
]
answer = """Agentforce locks you to the Salesforce graph and Salesforce \
billing. Skycot is provider-routed and channel-portable — your worker \
runs on the model that wins the routing decision, and reaches a customer \
on whatever channel they're on. Independent layer, not a Salesforce \
upsell."""
declared_claim_classes = ["competitive-positioning"]
audience_tags = ["investor", "buyer"]
last_reviewed = "2026-05-25"
review_owner = "founder@example.com"

[[entries]]
id = "build-vs-buy"
prompts = [
  "Why not just build this in-house?",
  "Can't we just wrap GPT ourselves?",
  "What's stopping our engineers from doing this?",
  "Why pay you when LLMs are commodity?",
]
answer = """The model is commodity; the workforce around it isn't. Skycot \
ships the audit trail, the RBAC, the multi-tenant routing, the skill \
library, the escalation policy, the eval harness — six months of \
plumbing before your team types the first system prompt. Buy the \
platform; spend your engineers on your moat."""
declared_claim_classes = ["competitive-positioning"]
audience_tags = ["investor", "buyer"]
last_reviewed = "2026-05-25"
review_owner = "founder@example.com"

[[entries]]
id = "moat-question"
prompts = [
  "What is your moat?",
  "What stops a bigger company from copying you?",
  "Why won't OpenAI just build this?",
  "What's defensible here?",
]
answer = """The moat is the workforce graph: every tenant's worker outcomes, \
escalations, and feedback flow back into the skill library — \
cross-tenant skills get sharper, single-tenant memories stay private. \
A model vendor selling raw inference can't replicate the per-tenant \
learning loop without being the workforce layer themselves."""
declared_claim_classes = ["competitive-positioning"]
audience_tags = ["investor"]
last_reviewed = "2026-05-25"
review_owner = "founder@example.com"
