schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Pipeline check", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "pipeline_check"
description = "Open the screening rubric + score-resume skill so the runner is wired against the recruiter pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/recruiter/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/recruiter/skills/draft_screening_email.skill.md" }
depends_on = ["read_manifest"]
