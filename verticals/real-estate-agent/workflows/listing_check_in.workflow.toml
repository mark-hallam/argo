schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Listing check-in", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "listing_check_in"
description = "Open the listing rubric + buyer-followup skill so the runner is wired against the real-estate-agent pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/real-estate-agent/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/real-estate-agent/skills/draft_offer.skill.md" }
depends_on = ["read_manifest"]
