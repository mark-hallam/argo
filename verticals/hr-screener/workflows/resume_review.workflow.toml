schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Resume review", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "resume_review"
description = "Open the screening rubric + score-resume skill so the runner is wired against the HR-screener pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/hr-screener/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/hr-screener/skills/anonymize_incident_report.skill.md" }
depends_on = ["read_manifest"]
