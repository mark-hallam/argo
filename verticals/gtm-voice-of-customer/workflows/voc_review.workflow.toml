schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the anchor
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Voc review", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "voc_review"
description = "Open the manifest + synthesize-voice-of-customer skill so the runner is wired against the voice-of-customer pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-voice-of-customer/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-voice-of-customer/skills/synthesize_voice_of_customer.skill.md" }
depends_on = ["read_manifest"]
