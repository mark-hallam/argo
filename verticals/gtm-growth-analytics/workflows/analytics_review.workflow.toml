schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the anchor
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Analytics review", which
# is what the worker's Schedules card renders post-install.

[workflow]
name        = "analytics_review"
description = "Open the manifest + the compile-funnel-dashboard skill so the runner is wired against the gtm-growth-analytics pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-growth-analytics/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-growth-analytics/skills/compile_funnel_dashboard.skill.md" }
depends_on = ["read_manifest"]
