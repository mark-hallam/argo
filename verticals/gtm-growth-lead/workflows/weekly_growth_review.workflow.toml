schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the anchor
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Weekly growth review",
# which is what the worker's Schedules card renders post-install.

[workflow]
name        = "weekly_growth_review"
description = "Open the manifest + the weekly-growth-review skill so the runner is wired against the gtm-growth-lead pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-growth-lead/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-growth-lead/skills/run_weekly_growth_review.skill.md" }
depends_on = ["read_manifest"]
