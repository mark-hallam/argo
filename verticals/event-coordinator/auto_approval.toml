enabled                   = true
max_usd_micros_per_action = 100000
daily_budget_usd_micros   = 2000000

# Autonomous-safe surface is propose / draft / compare / build only.
# Venue proposals, attendee comms drafts, catering bid comparisons,
# and per-hour runbooks never mutate external state — they read
# inventory + sources and produce drafts. Booking a venue, signing a
# contract, placing a catering order, sending an attendee email
# blast, and issuing a refund are intentionally absent from this
# list and route through `[escalation].human_approval_required` in
# vertical.toml. Defence-in-depth: even if a future edit grants a
# wake type for one of those actions, the escalation gate still
# fires because deny+approval-required always wins.
wake_action_types = [
  "propose_venue",
  "draft_attendee_comms",
  "compare_catering_bids",
  "build_runbook",
]
