schema_version = "1"

[vertical]
id          = "event-coordinator"
name        = "Event Coordinator"
description = "Internal-event / corporate-offsite / conference coordination: venue sourcing, catering bid comparison, attendee comms, vendor management, and per-hour run-of-show. Drafts only — booking venues, signing contracts, placing catering orders, sending attendee email blasts, and issuing refunds always route through human approval. Budget-ceiling enforcement, the 3-bid rule for spend ≥ $5k, dietary-coverage completeness, and ADA-accessibility checks are load-bearing in the system prompt. Optional gcal/airbnb/eventbrite MCP connectors; works in dry-run when connectors are absent."
version     = "0.1.0"
authors     = ["Mark Hallam"]
tags        = ["event-coordinator", "events", "venue", "catering", "logistics", "runbook", "demo"]

[role]
system_prompt = "prompts/system.md"
persona       = "prompts/persona.md"

[provider]
default   = "anthropic/claude-sonnet-4-6"
fallback  = "openai/gpt-4o"
cost_tier = "balanced"

[tools]
allowed = ["web_search", "web_extract", "file_read"]
denied  = ["terminal", "file_patch", "delegate_task"]

[memory]
schema = "memory/schema.toml"

[evaluation]
suites = ["eval/seed.jsonl"]

[mcp_servers]
gcal       = { transport = "stdio", command = "argo-mcp-connector-gcal",       args = [] }
airbnb     = { transport = "stdio", command = "argo-mcp-connector-airbnb",     args = [] }
eventbrite = { transport = "stdio", command = "argo-mcp-connector-eventbrite", args = [] }

[escalation]
human_approval_required = ["book_venue", "sign_contract", "place_catering_order", "send_attendee_email_blast", "issue_refund"]
escalate_after_failures = 2
escalate_to             = "operator"

[gateway]
public_endpoints = []
auth_required    = true

[tui]
overlay_label = "Event Coordinator"
