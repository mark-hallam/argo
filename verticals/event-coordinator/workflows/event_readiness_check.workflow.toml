schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Event readiness check", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "event_readiness_check"
description = "Open the run-sheet anchor + vendor-confirmation skill so the runner is wired against the event-coordinator pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/event-coordinator/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/event-coordinator/skills/run_of_show.skill.md" }
depends_on = ["read_manifest"]
