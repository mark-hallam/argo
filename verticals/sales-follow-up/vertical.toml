schema_version = "1"

[vertical]
id          = "sales-follow-up"
name        = "Sales Follow-up"
description = "Follow-up worker for warm leads — research, draft personalised outreach, propose follow-up cadence. Approval-gated for anything that touches a prospect's inbox or the CRM."
version     = "0.1.0"
authors     = ["Argo platform team"]
tags        = ["sales", "outreach", "draft-only", "follow-up"]

[memory]
schema = "memory/schema.toml"

[escalation]
# Anything that touches a prospect's inbox, the CRM, the operator's
# sequencer, or exports lead PII is approval-gated. The four
# autonomous-safe skills (research_lead_signals /
# draft_followup_message / propose_cadence /
# summarize_conversation_thread) never appear in this list; their
# outputs route into these gated actions when the operator approves.
human_approval_required = [
  "send_email",
  "send_followup_email",
  "update_crm",
  "log_to_crm",
  "schedule_call",
  "schedule_followup_cadence",
  "add_to_sequence",
  "export_lead_list",
]
escalate_after_failures = 3
escalate_to             = "operator"

[role]
system_prompt = "prompts/system.md"
persona       = "prompts/persona.md"

[provider]
default   = "anthropic"
fallback  = "openai"
cost_tier = "balanced"

[tools]
allowed = ["web_search", "web_extract"]
denied  = []

# ─────────────────────────── actions ────────────────────────────
# Autonomous-safe — research + drafting only.

[actions.research_lead]
risk              = "low"
requires_approval = false
description       = "Research a warm lead — company, role, recent signals — to inform follow-up tone."
executor          = "human"
instruction_template = """
# Research lead `{{ payload.lead_name }}`

Lead:    `{{ payload.lead_name }}`
Company: `{{ payload.company }}`

Steps:
1. Web search for `{{ payload.lead_name }} + {{ payload.company }}` to verify role + tenure.
2. Pull last 3-6 months of public signals (LinkedIn posts, podcast guest spots, press mentions).
3. Note one specific signal that justifies the follow-up cadence.

When done:

```
argo worker actions complete {{ action_id }} --note "research done" \\
  --result-json '{"role": "<title>", "tenure_months": <n>, "signal": "<short>", "signal_url": "<url>"}'
```
"""

[actions.find_contact]
risk              = "low"
requires_approval = false
description       = "Verify a lead's email + LinkedIn from public sources. Drafting only — does not send."
executor          = "human"

[actions.draft_followup]
risk              = "low"
requires_approval = false
description       = "Draft a follow-up email body that references the previous touch + the new signal."
executor          = "human"

# Approval-gated — touches a prospect's inbox or CRM state.

[actions.send_followup_email]
risk              = "high"
requires_approval = true
description       = "Send the drafted follow-up email. HIGH RISK — touches a prospect's inbox; not reversible."
executor          = "human"
instruction_template = """
# Send follow-up — `{{ payload.subject }}` to `{{ payload.recipient_email }}`

⚠️ **HIGH RISK** — emailing a prospect; cannot be undone.

Approved by `{{ approved_by }}` at `{{ approved_at }}`.

Recipient: `{{ payload.recipient_email }}`
Subject:   `{{ payload.subject }}`
Signal:    `{{ payload.signal_url }}` ({{ payload.signal }})

Body (review BEFORE sending):

> {{ payload.body }}

Steps:
1. Open your sequencer (Apollo / Outreach / Mixmax / direct Gmail).
2. Paste the body; tweak greeting + signoff to your tone.
3. Send.

When sent:

```
argo worker actions complete {{ action_id }} --note "sent" \\
  --result-json '{"recipient": "{{ payload.recipient_email }}", "subject": "{{ payload.subject }}", "sequenced_in": "<tool>"}'
```
"""

[actions.schedule_followup_cadence]
risk              = "medium"
requires_approval = true
description       = "Schedule the next follow-up touch in the operator's sequencer (next-touch + offset days)."
executor          = "human"

[actions.log_to_crm]
risk              = "medium"
requires_approval = true
description       = "Log the follow-up touch to the operator's CRM (HubSpot / Salesforce / Close). Mutates external state."
executor          = "human"
platforms         = ["hubspot", "salesforce", "close"]
instruction_template = """
# Log to CRM — `{{ payload.lead_name }}` ({{ platform }})

Approved by `{{ approved_by }}` at `{{ approved_at }}`.

Lead:    `{{ payload.lead_name }}` ({{ payload.recipient_email }})
Touch:   `{{ payload.touch_type }}` — `{{ payload.notes }}`

Steps:
1. Open `{{ platform }}`, find the contact.
2. Add a `Note` on the contact's timeline with the body above.
3. Tag with `follow-up-{{ payload.cadence }}`.

When done:

```
argo worker actions complete {{ action_id }} --note "logged" \\
  --result-json '{"crm": "{{ platform }}", "contact_id": "<id>"}'
```
"""

# ───────────────────────── new skill actions ─────────────────────────
# Four autonomous-safe skills layered on top of the existing six
# actions (mission-vertical-sales-follow-up-flesh-out). Each emits a
# DRAFT artifact only — none send, schedule, write to CRM, or export.
# The five external-effect action_types named in
# `[escalation].human_approval_required` cover every path from these
# skills to a real prospect inbox or CRM mutation.

[actions.research_lead_signals]
risk              = "low"
requires_approval = false
description       = "Summarise recent public signals for a warm lead and propose one relevance hook for the next touch. Recommends skip when no fresh signal in 30 days. Draft-only."
executor          = "human"

[actions.draft_followup_message]
risk              = "low"
requires_approval = false
description       = "Produce a personalised follow-up draft + warm/professional/brief tone variants + suggested subject line. Flags CAN-SPAM unsubscribe-line inclusion and blocks GDPR opt-out leads + forbidden-phrase trips. Draft-only."
executor          = "human"

[actions.propose_cadence]
risk              = "low"
requires_approval = false
description       = "Recommend the next-touch day + channel, an escalation threshold, and a dormancy threshold given the lead's stage + last-touch + engagement-history. Recommendation only — the operator commits any sequence change."
executor          = "human"

[actions.summarize_conversation_thread]
risk              = "low"
requires_approval = false
description       = "Distil a message thread into objection themes, buying signals, recommended next action, and CRM-tag suggestions. The vertical never writes to the CRM; the operator commits any tags."
executor          = "human"

[evaluation]
# Follow-up eval suite (#759). Validates signal-led drafting,
# personalization grounding, the abstain contract on thin signals,
# and approval-gate discipline for send actions. The seed.jsonl
# suite added in mission-vertical-sales-follow-up-flesh-out adds
# coverage for the four new skills + three escalation cases
# (GDPR opt-out / explicit-do-not-contact / forbidden-phrase).
suites = ["eval/followup_core.jsonl", "eval/seed.jsonl"]
