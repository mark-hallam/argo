schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Nudge sweep", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "nudge_sweep"
description = "Open the followup rubric + nudge-draft skill so the runner is wired against the sales-follow-up pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/sales-follow-up/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/sales-follow-up/skills/detect_disengagement.skill.md" }
depends_on = ["read_manifest"]
