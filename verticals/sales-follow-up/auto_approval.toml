enabled                   = true
max_usd_micros_per_action = 30000
daily_budget_usd_micros   = 750000

# Autonomous-safe surface is research + draft + cadence-proposal +
# thread-summary only. None of the four touch the prospect's inbox,
# CRM, or sequencer — every external-effect action routes through
# `[escalation].human_approval_required` in vertical.toml:
#
#   - send_email          (any outbound prospect message — CAN-SPAM)
#   - update_crm          (HubSpot / Salesforce / Pipedrive writes)
#   - schedule_call       (calendar bookings)
#   - add_to_sequence     (multi-day sequencer enrolment)
#   - export_lead_list    (data exfil — GDPR sensitive)
#
# Defence in depth: even if a future edit adds one of these to
# wake_action_types, the escalation gate still fires because
# human-approval-required always wins.
wake_action_types = [
  "research_lead_signals",
  "draft_followup_message",
  "propose_cadence",
  "summarize_conversation_thread",
]
