schema_version = "1"

[vertical]
id          = "executive-assistant"
name        = "Executive Assistant"
description = "Single-principal executive assistant: email triage, calendar coordination, meeting prep, and travel logistics. Drafts only — any external comms, spend, or external-attendee meeting scheduling routes through human approval. Optional gmail/gcal/slack MCP connectors; works in dry-run when connectors are absent."
version     = "0.1.0"
authors     = ["Mark Hallam"]
tags        = ["executive-assistant", "ea", "email", "calendar", "meeting-prep", "travel", "demo"]

[role]
system_prompt = "prompts/system.md"
persona       = "prompts/persona.md"

[provider]
default   = "anthropic/claude-sonnet-4-6"
fallback  = "openai/gpt-4o"
cost_tier = "balanced"

[tools]
allowed = ["web_search", "web_extract", "file_read"]
denied  = ["terminal", "file_patch", "delegate_task"]

[memory]
schema = "memory/schema.toml"

[evaluation]
suites = ["eval/seed.jsonl"]

[mcp_servers]
gmail = { transport = "stdio", command = "argo-mcp-connector-gmail", args = [] }
gcal  = { transport = "stdio", command = "argo-mcp-connector-gcal",  args = [] }
slack = { transport = "stdio", command = "argo-mcp-connector-slack", args = [] }

[escalation]
human_approval_required = ["send_email_external", "book_travel", "schedule_meeting_with_external"]
escalate_after_failures = 2
escalate_to             = "operator"

[gateway]
public_endpoints = []
auth_required    = true

[tui]
overlay_label = "Executive Assistant"
