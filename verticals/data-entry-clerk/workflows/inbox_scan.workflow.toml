schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Inbox scan", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "inbox_scan"
description = "Open the field-mapping rubric + record-write skill so the runner is wired against the data-entry pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/data-entry-clerk/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/data-entry-clerk/skills/deduplicate_records.skill.md" }
depends_on = ["read_manifest"]
