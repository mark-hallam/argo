enabled                   = true
max_usd_micros_per_action = 50000
daily_budget_usd_micros   = 1000000

# Autonomous-safe surface is read + draft only. RFQ drafting, bid
# comparison, vendor health checks, and contract review never mutate
# external state — they read inventory + sources and produce drafts.
# Placing a purchase order, signing an agreement, approving a new
# vendor, and renewing a contract are intentionally absent from this
# list and route through `[escalation].human_approval_required` in
# vertical.toml. Defence-in-depth: even if a future edit grants a wake
# type for one of those actions, the escalation gate still fires
# because deny+approval-required always wins.
wake_action_types = [
  "draft_rfq",
  "compare_bids",
  "vendor_health_check",
  "contract_review",
]
