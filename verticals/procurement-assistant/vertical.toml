schema_version = "1"

[vertical]
id          = "procurement-assistant"
name        = "Procurement Assistant"
description = "Procurement specialist for sourcing, bid comparison, vendor health, and contract review. Drafts only — placing purchase orders, signing agreements, approving vendors, and renewing contracts always route through human approval. Budget-ceiling enforcement and the 3-quote rule for spend ≥ $5k are load-bearing in the system prompt. Optional ariba/coupa MCP connectors; works in dry-run when connectors are absent."
version     = "0.1.0"
authors     = ["Mark Hallam"]
tags        = ["procurement-assistant", "procurement", "sourcing", "rfq", "vendor-management", "contract-review", "demo"]

[role]
system_prompt = "prompts/system.md"
persona       = "prompts/persona.md"

[provider]
default   = "anthropic/claude-sonnet-4-6"
fallback  = "openai/gpt-4o"
cost_tier = "balanced"

[tools]
allowed = ["web_search", "web_extract", "file_read"]
denied  = ["terminal", "file_patch", "delegate_task"]

[memory]
schema = "memory/schema.toml"

[evaluation]
suites = ["eval/seed.jsonl"]

[mcp_servers]
ariba = { transport = "stdio", command = "argo-mcp-connector-ariba", args = [] }
coupa = { transport = "stdio", command = "argo-mcp-connector-coupa", args = [] }

[escalation]
human_approval_required = ["place_purchase_order", "sign_agreement", "approve_vendor", "renew_contract"]
escalate_after_failures = 2
escalate_to             = "operator"

[gateway]
public_endpoints = []
auth_required    = true

[tui]
overlay_label = "Procurement Assistant"
