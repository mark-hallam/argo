schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Filing readiness check", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "filing_readiness_check"
description = "Open the filing rubric + workpaper skill so the runner is wired against the tax-prep pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/tax-prep/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/tax-prep/skills/draft_return.skill.md" }
depends_on = ["read_manifest"]
