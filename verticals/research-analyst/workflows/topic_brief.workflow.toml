schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Topic brief", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "topic_brief"
description = "Open the research rubric + summary-draft skill so the runner is wired against the research-analyst pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/research-analyst/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/research-analyst/skills/flag_thesis_disconfirming_evidence.skill.md" }
depends_on = ["read_manifest"]
