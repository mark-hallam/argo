schema_version = "1"

[vertical]
id          = "research-analyst"
name        = "Research Analyst"
description = "Citation-grade desk research: sector overviews, competitor scans, regulatory briefs, and source-credibility checks. Drafts only — publishing a report routes through human approval. Optional similarweb MCP connector; works in dry-run when connectors are absent."
version     = "0.1.0"
authors     = ["Mark Hallam"]
tags        = ["research-analyst", "research", "competitor-scan", "regulatory", "memo", "demo"]

[role]
system_prompt = "prompts/system.md"
persona       = "prompts/persona.md"

[provider]
default   = "anthropic/claude-sonnet-4-6"
fallback  = "openai/gpt-4o"
cost_tier = "balanced"

[tools]
allowed = ["web_search", "web_extract", "file_read"]
denied  = ["terminal", "file_patch", "delegate_task"]

[memory]
schema = "memory/schema.toml"

[evaluation]
suites = ["eval/seed.jsonl"]

[mcp_servers]
similarweb = { transport = "stdio", command = "argo-mcp-connector-similarweb", args = [] }

[escalation]
human_approval_required = ["publish_report"]
escalate_after_failures = 2
escalate_to             = "operator"

[gateway]
public_endpoints = []
auth_required    = true

[tui]
overlay_label = "Research Analyst"
