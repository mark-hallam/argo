schema_version = "1"

[[entry]]
key     = "competitors"
type    = "list-of-objects"
purpose = "Configured competitor domain list + last-scan digests."

[[entry]]
key     = "brand_mentions"
type    = "list-of-objects"
purpose = "Brand-mention rows with sentiment + source URL. Append-only; the weekly summary reads from here."

[[entry]]
key     = "drafts"
type    = "list-of-objects"
purpose = "Draft social posts / blog posts / newsletters waiting on operator approval."

[[entry]]
key     = "weekly_summaries"
type    = "list-of-objects"
purpose = "Internal weekly digest rows. The operator reads these to stay current on brand + competitor activity."
