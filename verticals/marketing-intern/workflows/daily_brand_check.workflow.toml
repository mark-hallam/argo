schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Daily brand check", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "daily_brand_check"
description = "Open the brand-monitoring anchor + competitive-scan skill so the runner is wired against the marketing-intern pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/marketing-intern/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/marketing-intern/skills/brand_mention_summary.skill.md" }
depends_on = ["read_manifest"]
