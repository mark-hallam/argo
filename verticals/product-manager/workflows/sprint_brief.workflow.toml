schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Sprint brief", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "sprint_brief"
description = "Open the sprint rubric + status-roll-up skill so the runner is wired against the product-manager pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/product-manager/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/product-manager/skills/draft_prd.skill.md" }
depends_on = ["read_manifest"]
