schema_version = "1"

[vertical]
id          = "gtm-engineer"
name        = "GTM Engineer"
description = "Designs, executes, analyzes, and improves go-to-market strategies through ICP definition, account/persona research, personalized outreach drafts, campaign analysis, and learned-skill proposals. Research and outreach drafts are autonomous; outreach SENDS are approval-gated — nothing is auto-sent."
version     = "0.1.0"
authors     = ["Mark Hallam"]
tags        = ["gtm", "sales", "growth", "outbound", "strategy", "ai-agent", "draft-only"]

[role]
system_prompt = "prompts/system.md"
persona       = "prompts/persona.md"

[provider]
default   = "anthropic/claude-sonnet-4-6"
fallback  = "openai/gpt-4o"
cost_tier = "balanced"

# Safety boundary — DRAFT-ONLY. The deny list is the real lock
# (deny-wins precedence in #655); the allow list is the
# discoverability hint to the agent. Every state-mutating + every
# external-sending tool stays denied until a future approval-gated
# integration ships behind explicit operator opt-in.
#
# `memory` is denied because the in-tree builtin is a stub
# ("memory store not wired" — lands with Agent H / Phase 3 §14).
#
# `web_search` and `web_extract` are ALLOWED again as of #723.
# They were previously denied (#722) because the in-tree
# implementations were schema-only stubs; #723 ships real HTTP
# backends (DuckDuckGo HTML by default; Tavily / Brave when
# `TAVILY_API_KEY` / `BRAVE_API_KEY` is set). The worker's
# pre-flight gate now passes for this manifest and the
# multi-step loop can plan → research → verify → draft inside
# one queued job.
[tools]
allowed = ["file_read", "web_search", "web_extract"]
denied  = ["terminal", "file_write", "file_patch", "delegate_task", "memory"]

[memory]
schema = "memory/schema.toml"
seed   = "memory/seed/"

[skills]
bundle = "skills/"

# Simple smoke workflow — reads README + system.md as a sanity
# check that the runner is wired against this vertical end-to-end.
# Per the spec: "keep workflows simple". The richer GTM loop
# (hypothesis → research → draft → analyze → pattern → propose)
# is exercised by the eval suite + the agent's prompt, not a
# pre-baked workflow file (workflow steps are deferred without
# the LLM-driven runner today).
[workflows]
files = ["workflows/read_charter.workflow.toml"]

[escalation]
# Defence-in-depth: even though delegate_task is in the deny
# list, also gate it here so a future edit that accidentally
# removes it from `denied` still fails closed (#660). Same
# pattern as pr-checker.
human_approval_required = ["delegate_task"]
escalate_after_failures = 2
escalate_to             = "logs"

# GTM-quality targets as first-class [[kpi]] entries — the flexible,
# named KPI mechanism the rest of the GTM verticals use. Replaces the
# legacy [success_metrics] block, whose deny_unknown_fields schema only
# accepted support-style deflection/response fields that never fit a
# draft-only GTM agent.
[[kpi]]
name        = "personalization_quality_target"
kind        = "percentage"
threshold   = 85
comparator  = "gte"
gate        = "warn"

[[kpi]]
name        = "pattern_detection_target"
kind        = "percentage"
threshold   = 80
comparator  = "gte"
gate        = "warn"

[[kpi]]
name        = "learned_skill_proposal_quality_target"
kind        = "percentage"
threshold   = 80
comparator  = "gte"
gate        = "warn"

[[kpi]]
name        = "hallucination_rate_max_pct"
kind        = "percentage"
threshold   = 5
comparator  = "lte"
gate        = "warn"

[evaluation]
suites = [
    "eval/gtm_engineer_core.jsonl",
    "eval/worker_v3_emission.jsonl",
]

[gateway]
public_endpoints = []
auth_required    = true

[tui]
overlay_label = "GTM Engineer"

# ─────────────────────────── Worker v3 actions (#729)
#
# Action vocabulary the GTM Engineer can emit while running a
# job. The OS reads this section at action-emission time and
# stamps `requires_approval` + `risk_level` on every persisted
# `worker_action` row — the model can't override these. See
# `docs/design/worker_v3_execution.md` §5 for the design.
#
# Three categories per the SKYCOT safety boundary:
#   * autonomous-safe (risk = low, requires_approval = false)
#   * approval-gated  (requires_approval = true)
#   * forbidden       (not declared here at all)
#
# `executor = "human"` for every action in v1 — the worker
# produces a ready-to-paste artifact bundle and the operator
# runs it manually. Later (#733+) some of these will gain a
# `browser_mcp` or per-platform `api` executor without
# changing the action's name or payload shape.
#
# The GTM loop is wired declaratively via `on_complete_emit`:
#   define_icp → find_target_accounts → research_company →
#   research_person → draft_outreach → (operator approves) →
#   send_outreach [TERMINAL, approval-gated]
# and the learning loop:
#   analyze_campaign → detect_gtm_pattern → propose_gtm_skill
#   [TERMINAL — operator-decided, no auto-chain]
# Every research/draft step is autonomous-safe; the ONE
# external-mutation step (send_outreach) is approval-gated — it
# NEVER auto-sends. On the model-emitted path the OS also downgrades
# it to `blocked` when research evidence is thin; an auto-emitted
# chain follow-up still lands `pending` (approval is the load-bearing
# gate, not the evidence check).

[actions]

# Autonomous-safe — worker may execute without operator approval.

[actions.define_icp]
risk              = "low"
requires_approval = false
description       = "Define or refine an Ideal Customer Profile (industry, size, buyer roles, pains, trigger signals, exclusions) — draft artifact only."
executor          = "human"
# Once the operator confirms the ICP is worth targeting,
# auto-emit the account-finding step. Autonomous-safe →
# autonomous-safe so no approval gate fires.
on_complete_emit  = ["find_target_accounts"]
instruction_template = """
# Define ICP for `{{ payload.product }}`

Target market hypothesis: `{{ payload.target_market }}`.

Produce an Ideal Customer Profile:
1. Industry / vertical, company size band, buyer roles.
2. Pain points + trigger signals (what makes NOW the moment).
3. Explicit exclusions (the negative ICP sharpens targeting).
4. Separate `verified` facts from `assumed` inferences; list evidence gaps.

When done, run:

```
argo worker actions complete {{ action_id }} --note "<confidence>" \\
  --result-json '{"industry": "<...>", "company_size": "<...>", "confidence": "<low|medium|high>"}'
```
"""

[actions.find_target_accounts]
risk              = "low"
requires_approval = false
description       = "Identify ICP-matched target accounts via web research — a ranked, evidence-backed list, not a dump."
executor          = "human"
# Once the operator confirms the account list, auto-emit
# per-account company research. Autonomous-safe → autonomous-safe.
on_complete_emit  = ["research_company"]
instruction_template = """
# Find target accounts for segment `{{ payload.target_segment }}`

Using the ICP in scope, surface accounts that match strong
trigger signals (recent funding, key hires, product launches).

Rules:
1. Prioritise verified signals over broad coverage.
2. Never invent firmographics — mark `fit_score: low` + put the
   gap in `missing_evidence` when a source returns nothing.
3. Cap at the operator's requested size; an empty list is valid.

When done, run:

```
argo worker actions complete {{ action_id }} --note "<count> accounts" \\
  --result-json '{"accounts": [{"company": "<...>", "fit_score": "<...>"}]}'
```
"""

# Web research hits transient backend errors regularly; allow
# the worker / operator to re-attempt without burning the
# manifest's safety budget. 3 attempts total = original + 2
# retries.
[actions.find_target_accounts.retry]
max_attempts          = 3
backoff               = "exponential"
initial_delay_seconds = 30

[actions.research_company]
risk              = "low"
requires_approval = false
description       = "Research a single account for GTM relevance — verified facts vs. inferred pains, with a sourced outreach angle. Draft artifact only."
executor          = "human"
# Once the company research lands, auto-emit per-role persona
# research. Autonomous-safe → autonomous-safe.
on_complete_emit  = ["research_person"]
instruction_template = """
# Research company `{{ payload.company }}`

Build a GTM-relevant company profile:
1. Verified summary (facts only, each cited to a source URL).
2. `relevant_signals` with evidence + recency.
3. `likely_pains` each marked `basis: verified|inferred`.
4. A single `outreach_angle` grounded in a verified signal — or
   `null` + `fit_score: low` when evidence is too thin to
   personalise (abstain rather than invent).

When done, run:

```
argo worker actions complete {{ action_id }} --note "<fit_score>" \\
  --result-json '{"company": "{{ payload.company }}", "fit_score": "<...>"}'
```
"""

[actions.research_company.retry]
max_attempts          = 3
backoff               = "exponential"
initial_delay_seconds = 30

[actions.research_person]
risk              = "low"
requires_approval = false
description       = "Research a target person or buying role for outreach relevance — role-based fallback when personal data is thin; never invents personal facts. Draft artifact only."
executor          = "human"
# Once persona research lands, auto-emit the outreach draft.
# Autonomous-safe → autonomous-safe (the DRAFT, not the send).
on_complete_emit  = ["draft_outreach"]
instruction_template = """
# Research person/role for `{{ payload.company }}`

Subject: person `{{ payload.person }}` / role `{{ payload.role }}`.

1. `role_relevance` — why this role matters for the hypothesis.
2. `likely_pains` each `basis: verified|role-inference`.
3. A safe, business-relevant `personalization_angle` (public,
   verifiable — never creepy LinkedIn-scrape detail).
4. Populate `uncertainty` so the draft knows what NOT to
   over-personalise.

When done, run:

```
argo worker actions complete {{ action_id }} --note "<buying_influence>" \\
  --result-json '{"role": "{{ payload.role }}", "buying_influence": "<...>"}'
```
"""

[actions.research_person.retry]
max_attempts          = 3
backoff               = "exponential"
initial_delay_seconds = 30

[actions.draft_outreach]
risk              = "low"
requires_approval = false
description       = "Draft personalised outbound messaging from ICP + account + persona research. A DRAFT only — the send lands separately and approval-gated."
executor          = "human"
# The draft is autonomous-safe. Completing it auto-emits the
# send_outreach step, which is approval-gated → the follow-up
# lands `pending`, requiring an explicit operator approve before
# anything is sent. (Evidence-thin sends are downgraded to `blocked`
# on the model-emitted path; the chain follow-up relies on the
# approval gate.) The chain stops here: no auto-send.
on_complete_emit  = ["send_outreach"]
instruction_template = """
# Draft outreach for `{{ payload.company }}`

Ground every line in the account + persona research:
1. No generic intros. Open with the reason THIS message is for
   THIS person at THIS company NOW.
2. No fabricated facts — every claim traces to the research.
3. One low-friction CTA. ≤120 words for cold outreach.
4. Abstain (return `abstained: true`) when context is
   insufficient — do not pad a weak draft.

When done, run:

```
argo worker actions complete {{ action_id }} --note "<confidence>" \\
  --result-json '{"subject": "<...>", "confidence": "<low|medium|high>"}'
```
"""

[actions.analyze_campaign]
risk              = "low"
requires_approval = false
description       = "Analyze GTM campaign performance and extract winning + failing patterns — proposes the next experiment, does not overfit small samples. Draft artifact only."
executor          = "human"
# Once the analysis lands, auto-emit pattern detection.
# Autonomous-safe → autonomous-safe.
on_complete_emit  = ["detect_gtm_pattern"]
instruction_template = """
# Analyze campaign `{{ payload.campaign }}`

From the supplied outcomes (replies, objections, conversions):
1. Headline metrics + `what_worked` / `what_failed` (each with
   its own confidence).
2. `objection_themes` with verbatim quotes when available.
3. `next_experiments` — hypothesis + test + expected signal.
4. Set `sample_size_warning` when N is too small for confident
   inference; do not overfit noise.

When done, run:

```
argo worker actions complete {{ action_id }} --note "<reply_rate>" \\
  --result-json '{"campaign": "{{ payload.campaign }}", "reply_rate": <num>}'
```
"""

[actions.analyze_campaign.retry]
max_attempts          = 3
backoff               = "exponential"
initial_delay_seconds = 30

[actions.detect_gtm_pattern]
risk              = "low"
requires_approval = false
description       = "Detect repeatable GTM patterns from accumulated evidence — requires ≥3 reinforcing observations; refuses to call a single observation a pattern. Draft artifact only."
executor          = "human"
# Once a pattern is detected, auto-emit the skill proposal step.
# Autonomous-safe → autonomous-safe.
on_complete_emit  = ["propose_gtm_skill"]
instruction_template = """
# Detect GTM patterns

Across the supplied account research, outreach outcomes, and
campaign results:
1. Three reinforcing observations OR it is NOT a pattern (put
   two-and-a-feeling in `non_patterns`).
2. Every pattern carries a `do_not_use_when` boundary.
3. `recommended_action`: watch | test | propose_skill.

When done, run:

```
argo worker actions complete {{ action_id }} --note "<n patterns>" \\
  --result-json '{"patterns": [{"pattern": "<...>", "data_points": <num>}]}'
```
"""

[actions.propose_gtm_skill]
risk              = "low"
requires_approval = false
description       = "Propose a reusable learned skill from a strong, evidence-backed pattern — always queued in pending_review, never auto-activated. Terminal: the operator decides whether to approve."
executor          = "human"
# TERMINAL — operator-decided, no auto-chain. The proposal lands
# in pending_review and the operator reviews it via
# `argo skill review`. on_complete_emit is INTENTIONALLY EMPTY
# (locked by gtm_engineer_chain_validation).
instruction_template = """
# Propose GTM skill from a detected pattern

Only when `detect_gtm_pattern` marked a pattern
`recommended_action: propose_skill` with ≥3 reinforcing
observations:
1. `lifecycle_state` MUST be `pending_review` (never `active`).
2. `scope_to_vertical: true` by default.
3. Include ≥1 counterexample (or "none seen in N campaigns").
4. Frame 1–3 narrow review questions for the operator.
5. Refuse (`refused: true`) from weak / conflicting evidence.

When done, run:

```
argo worker actions complete {{ action_id }} --note "pending_review" \\
  --result-json '{"name": "<snake_case_skill>", "lifecycle_state": "pending_review"}'
```
"""

# Approval-gated — touches another human / external surface.
# Worker may emit this as `pending` (evidence-thin sends are
# downgraded to `blocked` on the model-emitted path) but cannot
# execute it without an explicit `argo worker actions approve`
# from the operator.

[actions.send_outreach]
risk              = "high"
requires_approval = true
description       = "Send the approved outreach (email / LinkedIn) to the researched contact. HIGH RISK — touches another human; not reversible. Terminal: no auto follow-up."
executor          = "human"
# TERMINAL — no auto follow-up. on_complete_emit is
# INTENTIONALLY EMPTY (locked by gtm_engineer_chain_validation).
# Any follow-up send is a fresh operator-initiated decision.
instruction_template = """
# Send outreach to `{{ payload.contact }}` at `{{ payload.company }}`

⚠️ **HIGH RISK** — touches another human; cannot be undone.

Approved by `{{ approved_by }}` at `{{ approved_at }}`.

Message (review BEFORE sending):

> {{ payload.message }}

Hard rules:
1. NEVER send without sufficient ICP + company + person research
   evidence backing every personalised line — the evidence gate
   blocks this action when the research is thin.
2. Reference the research evidence: `{{ payload.evidence }}`.
3. Channel: `{{ payload.channel }}` (email / LinkedIn).

Steps:
1. Open `{{ payload.channel }}` for `{{ payload.contact }}`.
2. Paste the approved message above; do not edit the claims.
3. Send.

When done, run:

```
argo worker actions complete {{ action_id }} --note "sent" \\
  --result-json '{"contact": "{{ payload.contact }}", "channel": "{{ payload.channel }}"}'
```
"""

# ─────────────────────────── retry policies ────────────────────
# Retry caps per #755. The manifest defaults to max_attempts=1
# (no retries) when omitted; declared per-action above for the
# research steps (autonomous web research can retry more freely:
# max 3). The single high-risk send stays tight (max 2) to avoid
# accidentally double-sending to a human.

[actions.send_outreach.retry]
max_attempts = 2
