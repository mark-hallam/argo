schema_version = "1"

[vertical]
id          = "gtm-engineer"
name        = "GTM Engineer"
description = "Designs, executes, analyzes, and improves go-to-market strategies through ICP definition, account/persona research, personalized outreach drafts, campaign analysis, and learned-skill proposals. Drafts only — no sending."
version     = "0.1.0"
authors     = ["Mark Hallam"]
tags        = ["gtm", "sales", "growth", "outbound", "strategy", "ai-agent", "draft-only"]

[role]
system_prompt = "prompts/system.md"
persona       = "prompts/persona.md"

[provider]
default   = "anthropic/claude-sonnet-4-6"
fallback  = "openai/gpt-5.5"
cost_tier = "balanced"

# Safety boundary — DRAFT-ONLY. The deny list is the real lock
# (deny-wins precedence in #655); the allow list is the
# discoverability hint to the agent. Every state-mutating + every
# external-sending tool stays denied until a future approval-gated
# integration ships behind explicit operator opt-in.
#
# `memory` is denied because the in-tree builtin is a stub
# ("memory store not wired" — lands with Agent H / Phase 3 §14).
#
# `web_search` and `web_extract` are ALLOWED again as of #723.
# They were previously denied (#722) because the in-tree
# implementations were schema-only stubs; #723 ships real HTTP
# backends (DuckDuckGo HTML by default; Tavily / Brave when
# `TAVILY_API_KEY` / `BRAVE_API_KEY` is set). The worker's
# pre-flight gate now passes for this manifest and the
# multi-step loop can plan → research → verify → draft inside
# one queued job.
[tools]
allowed = ["file_read", "web_search", "web_extract"]
denied  = ["terminal", "file_write", "file_patch", "delegate_task", "memory"]

[memory]
schema = "memory/schema.toml"
seed   = "memory/seed/"

[skills]
bundle = "skills/"

# Simple smoke workflow — reads README + system.md as a sanity
# check that the runner is wired against this vertical end-to-end.
# Per the spec: "keep workflows simple". The richer GTM loop
# (hypothesis → research → draft → analyze → pattern → propose)
# is exercised by the eval suite + the agent's prompt, not a
# pre-baked workflow file (workflow steps are deferred without
# the LLM-driven runner today).
[workflows]
files = ["workflows/read_charter.workflow.toml"]

[escalation]
# Defence-in-depth: even though delegate_task is in the deny
# list, also gate it here so a future edit that accidentally
# removes it from `denied` still fails closed (#660). Same
# pattern as pr-checker.
human_approval_required = ["delegate_task"]
escalate_after_failures = 2
escalate_to             = "logs"

[success_metrics]
# Schema-supported fields only (#665 SuccessMetricsSection uses
# deny_unknown_fields). The richer GTM-quality targets live in
# README.md as documentation:
# - hallucination_rate_max ≤ 0.05
# - abstain when context is insufficient
# - personalization_quality_target ≥ 0.85
# - pattern_detection_target ≥ 0.80
# - learned_skill_proposal_quality_target ≥ 0.80
# A future SuccessMetricsSection extension can promote these to
# typed first-class fields.
deflection_target_pct       = 60
median_response_seconds     = 120
required_audit_chain_intact = true

[evaluation]
suites = ["eval/gtm_engineer_core.jsonl"]

[gateway]
public_endpoints = []
auth_required    = true

[tui]
overlay_label = "GTM Engineer"

# ─────────────────────────── Worker v3 actions (#729)
#
# Action vocabulary the GTM Engineer can emit while running a
# job. The OS reads this section at action-emission time and
# stamps `requires_approval` + `risk_level` on every persisted
# `worker_action` row — the model can't override these. See
# `docs/design/worker_v3_execution.md` §5 for the design.
#
# Three categories per the SKYCOT safety boundary:
#   * autonomous-safe (risk = low, requires_approval = false)
#   * approval-gated  (requires_approval = true)
#   * forbidden       (not declared here at all)
#
# `executor = "human"` for every action in v1 — the worker
# produces a ready-to-paste artifact bundle and the operator
# runs it manually. Later (#733+) some of these will gain a
# `browser_mcp` or per-platform `api` executor without
# changing the action's name or payload shape.

[actions]

# Autonomous-safe — worker may execute without operator approval.

[actions.create_listing_draft]
risk              = "low"
requires_approval = false
description       = "Draft a marketplace listing (title + body + tags) without posting it."
executor          = "human"
platforms         = ["facebook_marketplace", "ebay", "gumtree"]

[actions.verify_price]
risk              = "low"
requires_approval = false
description       = "Cross-check a proposed price against live retail / comp data via web_search + web_extract."
executor          = "human"
instruction_template = """
# Verify price for `{{ item_id }}`

Target price to verify: `${{ payload.target }}`.

Run a quick sanity check:
1. Pull at least 2 comparable listings (same item, same condition).
2. Note the median sold price and the median asking price.
3. Decide: is `${{ payload.target }}` within ±10% of the median?

When done, run:

```
argo worker actions complete {{ action_id }} --note "<verdict>" \\
  --result-json '{"median_asking": <num>, "median_sold": <num>, "verdict": "<within-band|too-high|too-low>"}'
```
"""

# Web research hits transient backend errors regularly; allow
# the worker / operator to re-attempt without burning the
# manifest's safety budget. 3 attempts total = original + 2
# retries.
[actions.verify_price.retry]
max_attempts          = 3
backoff               = "exponential"
initial_delay_seconds = 30

[actions.request_photos]
risk              = "low"
requires_approval = false
description       = "Produce a list of photos the operator must supply before listing can post."
executor          = "human"

# Approval-gated — touches money / public surfaces / buyers.
# Worker may emit these as `pending` but cannot execute them
# without an explicit `argo worker actions approve` from the
# operator.

[actions.post_listing]
risk              = "medium"
requires_approval = true
description       = "Post a previously-drafted listing to a marketplace platform. Reversible (delete) but public."
executor          = "human"
platforms         = ["facebook_marketplace", "ebay", "gumtree"]
instruction_template = """
# Post listing — `{{ payload.title }}` on `{{ platform }}`

Approved by `{{ approved_by }}` at `{{ approved_at }}`.

Title:    `{{ payload.title }}`
Price:    `${{ payload.price }}`
Item:     `{{ item_id }}`

Steps:
1. Sign into your `{{ platform }}` seller account.
2. Create a new listing with the title above.
3. Paste the description from the listing draft (see `assistant_output.md`).
4. Set price to `${{ payload.price }}` and shipping per the draft.
5. Upload photos (see `instructions.md` for the photo list if attached).
6. Publish.

When live, copy the listing URL and run:

```
argo worker actions complete {{ action_id }} --note "live" \\
  --result-json '{"listing_url": "<url>", "platform": "{{ platform }}"}'
```
"""

[actions.post_listing.instruction_templates]
ebay = """
# Post listing — `{{ payload.title }}` on **eBay**

Approved by `{{ approved_by }}` at `{{ approved_at }}`.

Listing:
- title:    `{{ payload.title }}`
- price:    `${{ payload.price }}`
- item_id:  `{{ item_id }}`

eBay-specific checklist:
1. **Listing format** — pick `Buy it Now` for fixed-price OR `Auction` for high-demand items.
2. **Category** — let eBay auto-detect; override if it lands in the wrong sub-category.
3. **Item specifics** — fill EVERY required field (Brand, Model, Condition, Size). eBay's algo penalises sparse listings.
4. **Photos** — at least 4. eBay caps at 12 free.
5. **Shipping** — quote actual cost; never `local pickup only` unless the item ships heavy.
6. **Returns** — 30-day returns recommended; reduces buyer-side friction.

When live, copy the listing URL and run:

```
argo worker actions complete {{ action_id }} --note "ebay live" \\
  --result-json '{"listing_url": "<url>", "platform": "ebay"}'
```
"""
facebook_marketplace = """
# Post listing — `{{ payload.title }}` on **Facebook Marketplace**

Approved by `{{ approved_by }}` at `{{ approved_at }}`.

Listing:
- title:    `{{ payload.title }}`
- price:    `${{ payload.price }}`
- item_id:  `{{ item_id }}`

Facebook Marketplace checklist:
1. **Category** — Marketplace forces you to pick one. Use the closest match.
2. **Photos** — Marketplace shows the first photo as the thumbnail. Pick the cleanest shot.
3. **Location** — defaults to your account; verify it's the right city for buyer search.
4. **Delivery** — `Local pickup` is fine; `Shipping` opens the listing to a wider audience.
5. **Description** — paste from the draft. Marketplace strips most formatting; review the rendered preview.

When live, copy the listing URL and run:

```
argo worker actions complete {{ action_id }} --note "fb live" \\
  --result-json '{"listing_url": "<url>", "platform": "facebook_marketplace"}'
```
"""

[actions.boost_listing]
risk              = "medium"
requires_approval = true
description       = "Pay to boost an existing listing's visibility. Spends operator funds."
executor          = "human"
platforms         = ["facebook_marketplace", "ebay"]

[actions.update_price]
risk              = "medium"
requires_approval = true
description       = "Change the public price on a posted listing."
executor          = "human"
platforms         = ["facebook_marketplace", "ebay", "gumtree"]

[actions.relist_item]
risk              = "medium"
requires_approval = true
description       = "Re-post an expired or removed listing. Public, reversible."
executor          = "human"
platforms         = ["facebook_marketplace", "ebay", "gumtree"]

[actions.mark_item_sold]
risk              = "medium"
requires_approval = true
description       = "Mark an item sold on a platform — closes the listing to further offers."
executor          = "human"
platforms         = ["facebook_marketplace", "ebay", "gumtree"]
instruction_template = """
# Mark sold — `{{ item_id }}` on `{{ platform }}`

Approved by `{{ approved_by }}` at `{{ approved_at }}`.

Steps:
1. Open the listing for `{{ item_id }}` on `{{ platform }}`.
2. Mark it sold (not `delete`; mark-sold preserves history).
3. Note the sale price + buyer username.

When done:

```
argo worker actions complete {{ action_id }} --note "sold" \\
  --result-json '{"sale_price": <num>, "buyer": "<username>"}'
```
"""

[actions.reply_to_buyer]
risk              = "high"
requires_approval = true
description       = "Send a reply to a buyer's message. Touches another human; not reversible."
executor          = "human"
platforms         = ["facebook_marketplace", "ebay", "gumtree"]
instruction_template = """
# Reply to buyer — `{{ item_id }}` on `{{ platform }}`

⚠️ **HIGH RISK** — touches another human; cannot be undone.

Approved by `{{ approved_by }}` at `{{ approved_at }}`.

Reply (review BEFORE sending):

> {{ payload.message }}

Steps:
1. Open the buyer's thread for `{{ item_id }}` on `{{ platform }}`.
2. Paste the reply above; tweak tone if it feels generic.
3. Send.

When done:

```
argo worker actions complete {{ action_id }} --note "replied" \\
  --result-json '{"buyer": "<username>", "message_sent": "<final-text>"}'
```
"""

[actions.follow_up_buyer]
risk              = "high"
requires_approval = true
description       = "Send a follow-up to a buyer who didn't respond to a prior message."
executor          = "human"
platforms         = ["facebook_marketplace", "ebay", "gumtree"]

# ─────────────────────────── retry policies ────────────────────
# Retry caps per #755. The manifest defaults to max_attempts=1
# (no retries) when omitted; declare here for action types where
# transient retries make sense. High-risk public-surface +
# buyer-touching actions stay tight (max 2) to avoid spamming;
# autonomous research can retry more freely.

[actions.post_listing.retry]
max_attempts = 2

[actions.boost_listing.retry]
max_attempts = 2

[actions.update_price.retry]
max_attempts = 2

[actions.relist_item.retry]
max_attempts = 2

[actions.mark_item_sold.retry]
max_attempts = 2

[actions.reply_to_buyer.retry]
max_attempts = 2

[actions.follow_up_buyer.retry]
max_attempts = 2
