schema_version = "1"

[[entry]]
key     = "prospects"
type    = "list-of-objects"
purpose = "One row per researched prospect. Carries the relevance signal + qualification score + bucket."

[[entry]]
key     = "icp_rubric"
type    = "list-of-objects"
purpose = "The operator-supplied ICP scoring rubric. Loaded once per workspace from `argo memory write`."

[[entry]]
key     = "drafts"
type    = "list-of-objects"
purpose = "Outreach drafts staged for operator approval. One row per `draft_outreach` action."

[[entry]]
key     = "meetings"
type    = "list-of-objects"
purpose = "Booked meetings + their gcal event ids. Updated on `book_meeting` approval."
