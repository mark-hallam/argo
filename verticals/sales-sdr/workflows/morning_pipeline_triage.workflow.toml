schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Morning pipeline triage", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "morning_pipeline_triage"
description = "Open the prospect rubric + outreach-draft skill so the runner is wired against the sales-SDR pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/sales-sdr/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/sales-sdr/skills/book_meeting.skill.md" }
depends_on = ["read_manifest"]
