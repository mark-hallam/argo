schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the anchor
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Creative review", which
# is what the worker's Schedules card renders post-install.

[workflow]
name        = "creative_review"
description = "Open the manifest + the draft-creative-concept skill so the runner is wired against the gtm-brand-creative pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-brand-creative/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-brand-creative/skills/draft_creative_concept.skill.md" }
depends_on = ["read_manifest"]
