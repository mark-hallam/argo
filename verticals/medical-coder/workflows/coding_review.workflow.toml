schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Coding review", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "coding_review"
description = "Open the coding rubric + claim-validation skill so the runner is wired against the medical-coder pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/medical-coder/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/medical-coder/skills/detect_upcoding_risk.skill.md" }
depends_on = ["read_manifest"]
