schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Donor follow-up check", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "donor_followup_check"
description = "Open the donor anchor + thank-you draft skill so the runner is wired against the fundraising-coordinator pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/fundraising-coordinator/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/fundraising-coordinator/skills/flag_term_sheet_redlines.skill.md" }
depends_on = ["read_manifest"]
