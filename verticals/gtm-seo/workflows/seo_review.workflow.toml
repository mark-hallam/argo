schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the anchor
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Seo review", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "seo_review"
description = "Open the manifest + the research-keywords skill so the runner is wired against the gtm-seo pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-seo/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-seo/skills/research_keywords.skill.md" }
depends_on = ["read_manifest"]
