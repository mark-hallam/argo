enabled = true
max_usd_micros_per_action = 200000
daily_budget_usd_micros   = 5000000

# Research reads are read-only / web-only and autonomous-safe.
# `draft_research_brief` was previously on the wake list but is
# removed now that it is wired to a live Dropbox upload — the
# operator approves the brief content + destination path before
# any file leaves the workspace. `send_outreach_email` is
# intentionally absent so it must always route through the human
# approval gate (defence-in-depth on top of
# `[escalation].human_approval_required` in vertical.toml).
wake_action_types = [
  "research_company",
  "identify_decision_makers",
]
