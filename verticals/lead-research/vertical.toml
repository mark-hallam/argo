schema_version = "1"

[vertical]
id          = "lead-research"
name        = "Lead Research"
description = "Prospect-research vertical. Given a target company (or ICP), produces a structured 1-pager: firmographic facts, likely buying-committee contacts, recent news, tech stack, and ranked talking points. Every claim is sourced or marked inferred. Outreach is intentionally out of scope and gated behind human approval — `sales-sdr` is the sibling vertical that actually sends."
version     = "0.1.0"
authors     = ["Mark Hallam"]
tags        = ["sales", "sdr-support", "research", "prospecting", "icp", "demo"]

[role]
system_prompt = "prompts/system.md"
persona       = "prompts/persona.md"

[provider]
default   = "anthropic/claude-sonnet-4-6"
fallback  = "openai/gpt-4o"
cost_tier = "balanced"

[tools]
allowed = ["web_search", "web_extract", "file_read"]
denied  = ["terminal", "file_write", "file_patch", "delegate_task"]

[memory]
schema = "memory/schema.toml"

[evaluation]
suites = ["eval/seed.jsonl"]

# MCP servers. Enrichment connectors (similarweb) are OPTIONAL —
# the vertical loads + lints clean without them; the worker degrades
# to web_search + web_extract. The zoominfo / clearbit / dropbox
# connectors were removed in 2026-05-14 cleanup (shape-B orphans, no
# implementations existed); `draft_research_brief`'s executor block
# still references the dropbox server and is broken-by-config until a
# follow-up vertical revision lands.
[mcp_servers]
similarweb = { transport = "stdio", command = "argo-mcp-connector-similarweb", args = [] }

# Outreach sends are NOT in this vertical's vocabulary — they live
# in `sales-sdr`. The entry below is a forward declaration so any
# orchestrator that wires lead-research into a wider pipeline knows
# the contract: if a downstream step proposes `send_outreach_email`
# while this vertical is on the stack, it MUST gate behind human
# approval.
[escalation]
human_approval_required = ["send_outreach_email", "draft_research_brief"]
escalate_after_failures = 2
escalate_to             = "operator"

[gateway]
public_endpoints = []
auth_required    = true

[tui]
overlay_label = "Lead Research"

[actions]

[actions.research_company]
risk              = "low"
requires_approval = false
description       = "Pull firmographic + recent-news + tech-stack signals for the target company. Read-only across web_search + optional zoominfo/clearbit/similarweb connectors. No external mutation."

[actions.identify_decision_makers]
risk              = "low"
requires_approval = false
description       = "Map the likely buying committee (titles + relevance signal). Read-only; sources every contact or marks it `inferred`."

[actions.draft_research_brief]
risk              = "medium"
requires_approval = true
description       = "Render the structured 1-pager brief and upload it to Dropbox as the durable handoff artefact for sales-sdr. Approval-gated — the operator approves the brief content + destination path before any file leaves the workspace. The brief is the demo-ready surface for this vertical."
executor          = { kind = "mcp", server = "dropbox", tool = "dropbox.upload", budget_usd = 0.05 }
platforms         = ["dropbox"]
instruction_template = "Upload research brief for `{{ payload.company_id }}` to Dropbox path `{{ payload.dropbox_path }}`. Approved by `{{ approved_by }}` at `{{ approved_at }}`. The brief body MUST cite every firmographic claim or mark it `inferred`; never include outreach copy in the brief itself — sales-sdr owns the send step."

[actions.draft_research_brief.retry]
max_attempts          = 2
backoff               = "exponential"
initial_delay_seconds = 60
