schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Caller greeting check", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "caller_greeting_check"
description = "Open the greeting rubric + booking-handoff skill so the runner is wired against the receptionist pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/receptionist/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/receptionist/skills/answer_faq.skill.md" }
depends_on = ["read_manifest"]
