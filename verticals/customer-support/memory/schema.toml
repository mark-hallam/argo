schema_version = "1"

[[entry]]
key     = "tickets"
type    = "list-of-objects"
purpose = "One row per incoming ticket the agent has seen. Carries topic + severity tags from triage and the eventual disposition."

[[entry]]
key     = "kb"
type    = "list-of-objects"
purpose = "Knowledge-base snippets the agent cites in drafts. Populated by `argo memory write` from the operator's product docs."

[[entry]]
key     = "drafts"
type    = "list-of-objects"
purpose = "Reply drafts staged for operator approval. One row per `draft_reply` action."

[[entry]]
key     = "escalations"
type    = "list-of-objects"
purpose = "Tickets handed off to the operator. Captures why the agent escalated so the operator can refine the KB."
