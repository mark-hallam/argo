schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the anchor
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Revops review", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "revops_review"
description = "Open the manifest + the audit-crm-hygiene skill so the runner is wired against the gtm-revops-admin pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-revops-admin/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/gtm-revops-admin/skills/audit_crm_hygiene.skill.md" }
depends_on = ["read_manifest"]
