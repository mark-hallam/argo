schema_version = "1"

# Smoke workflow per the spec ("keep workflows simple"): two
# tool_call steps that read the vertical's manifest + the first
# skill file. Proves the runner is wired against this vertical
# end-to-end (#659). The display name is "Incident readiness check", which is
# what the worker's Schedules card renders post-install.

[workflow]
name        = "incident_readiness_check"
description = "Open the runbook anchor + status-page skill so the runner is wired against the ops-on-call pack end-to-end."

[[step]]
name = "read_manifest"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/ops-on-call/vertical.toml" }

[[step]]
name = "read_anchor_skill"
kind = "tool_call"
tool = "file_read"
args = { path = "verticals/ops-on-call/skills/coordinate_war_room.skill.md" }
depends_on = ["read_manifest"]
