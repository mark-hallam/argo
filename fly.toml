app = "skycot-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ARGO_HOME = "/data"
  ARGO_VERTICALS_DIR = "/app/verticals"
  RUST_LOG = "info"

[mounts]
  source = "argo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
