[package]
name = "argo-executor-computer-use-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo native Linux computer-use executor (X11 + Wayland)"

[dependencies]
argo-types = { path = "../argo-types" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Wayland backend: xdg-desktop-portal D-Bus client. zbus is the
# pure-Rust D-Bus implementation; the blocking API in `zbus::blocking`
# matches the sync subprocess style of the X11 backend. Linux-only
# so non-Linux hosts cross-compile cleanly.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"
