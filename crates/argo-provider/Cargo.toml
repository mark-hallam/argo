[package]
name = "argo-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — provider manifests + transports"

[dependencies]
argo-types = { path = "../argo-types", version = "0.0.1" }
# Process-global prompt cache hit-rate counters (mission-prompt-cache-hit-rate-observability).
argo-telemetry = { path = "../argo-telemetry", version = "0.0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# tokio for `tokio::time::sleep` between retries (F-6, issue #3 (b)).
# Workspace tokio is already `features = ["full"]`; we name `time` explicitly
# so the local Cargo.toml documents the surface this crate uses.
tokio = { workspace = true, features = ["time"] }
# `futures::stream::BoxStream` for `Transport::complete_stream` (F-1, issue #3 (a)).
futures = { workspace = true }
# Bedrock transport — sigv4 + eventstream lives in the SDK rather than reqwest.
# Authorised by the Agent F brief alongside the rest of the dep allowlist.
aws-config = { workspace = true }
aws-sdk-bedrockruntime = { workspace = true }
aws-smithy-types = { workspace = true }
parking_lot = { workspace = true }
# `regex` for [discovery].include_pattern / exclude_pattern (§8.1
# manifest schema literally specifies regex syntax: `^gpt-[0-9]`,
# `preview|legacy|deprecated`).
regex = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Tests poll the streams produced by `complete_stream`; tokio's macros + rt
# bring `tokio_test::block_on` and `#[tokio::test]` into scope.
tokio = { workspace = true }
