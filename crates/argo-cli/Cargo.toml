[package]
name = "argo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — `argo` binary"

[[bin]]
name = "argo"
path = "src/main.rs"

[[bench]]
name = "session_throughput"
harness = false

[[bench]]
name = "message_write"
harness = false

[[bench]]
name = "gateway_request"
harness = false

[[bench]]
name = "audit_feed"
harness = false

[dependencies]
argo-agent-runner = { path = "../argo-agent-runner" }
argo-audit = { path = "../argo-audit" }
argo-orchestrator = { path = "../argo-orchestrator" }
argo-runtime = { path = "../argo-runtime" }
argo-workflow = { path = "../argo-workflow" }
argo-capability = { path = "../argo-capability" }
argo-channels = { path = "../argo-channels" }
argo-compliance = { path = "../argo-compliance" }
argo-config = { path = "../argo-config" }
argo-credentials = { path = "../argo-credentials" }
argo-cron = { path = "../argo-cron" }
argo-eval = { path = "../argo-eval" }
argo-forge = { path = "../argo-forge" }
argo-judge = { path = "../argo-judge" }
argo-marketplace = { path = "../argo-marketplace" }
argo-mcp = { path = "../argo-mcp" }
argo-mcp-image-gen = { path = "../argo-mcp-image-gen" }
argo-memory = { path = "../argo-memory", features = ["dreams-backend"] }
argo-provider = { path = "../argo-provider" }
argo-billing = { path = "../argo-billing" }
argo-redact = { path = "../argo-redact" }
argo-routing = { path = "../argo-routing" }
argo-skill = { path = "../argo-skill" }
argo-team-headline = { path = "../argo-team-headline" }
argo-sandbox = { path = "../argo-sandbox" }
argo-siem = { path = "../argo-siem" }
argo-store = { path = "../argo-store" }
argo-telemetry = { path = "../argo-telemetry" }
argo-tool = { path = "../argo-tool" }
argo-tui = { path = "../argo-tui" }
argo-voice-tui = { path = "../argo-voice-tui" }
argo-types = { path = "../argo-types" }
argo-vertical = { path = "../argo-vertical" }
argo-vertical-packs = { workspace = true }
argo-executor-computer-use = { path = "../argo-executor-computer-use" }
argo-executor-computer-use-macos = { path = "../argo-executor-computer-use-macos" }
argo-executor-document = { path = "../argo-executor-document" }
argo-executor-document-csv = { path = "../argo-executor-document-csv" }
argo-executor-document-gsuite = { path = "../argo-executor-document-gsuite" }
argo-executor-filesystem = { path = "../argo-executor-filesystem" }
argo-genesis = { path = "../argo-genesis" }
argo-identity = { path = "../argo-identity" }
# Ed25519 signature verification for `argo self-update` (release
# binary integrity); see crates/argo-cli/src/handlers/self_update.rs
# and crates/argo-cli/assets/release-pubkey.pem.
ed25519-dalek = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
# cron parsing for next_fire_at on duties in the worker-overview
# endpoint (Stream J8). Pinned to 0.12 to match argo-orchestrator
# and argo-team-headline; sensible deviation from J8's may-touch
# list (one-line additive Cargo.toml dep, no breaking changes).
cron = "0.12"
clap = { workspace = true }
# Generates shell completion scripts for `argo completions <shell>`
# (mission-cli-shell-completions). clap_complete consumes
# `Cli::command()` directly — no parallel CLI description needed.
clap_complete = "4"
csv = "1"
# Concurrent map for the per-IP token-bucket rate limiter
# (claude-security-rate-limit-by-ip). DashMap is not yet a workspace
# dep, so pin the latest 5.x line here.
dashmap = "5"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
sqlx = { workspace = true }
tokio = { workspace = true }
# Direct dep only for `tokio_util::sync::CancellationToken` used by the
# `mcp_health` background task (claude-mcp-server-health-check).
tokio-util = "0.7"
toml = { workspace = true }
tracing = { workspace = true }
flate2 = "1"
tar = "0.4"
# `argo cu replay --gif` decodes per-step PNG screenshots and
# encodes them as a GIF; `--inline` base64-encodes the PNG bytes
# into data URLs. Both deps are unique to the CU-replay handler;
# scoping them to argo-cli keeps the workspace tree lean
# (claude-cu-action-replay-cli).
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
base64 = "0.22"
# Used by the gateway's `/inbox/ws` + `/audit/stream` WebSocket upgrade
# (`mission-inbox-ws-real-websocket`): SHA-1 of `Sec-WebSocket-Key ||
# RFC 6455 magic GUID` produces the `Sec-WebSocket-Accept` header.
sha1 = "0.10"
# Used by `argo vertical install` (#675) to extract `.tar`
# sources into a temp dir before recursing through the
# directory-source code path.
tempfile = "3"
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
# OS-RNG access for the SSO middleware's PKCE verifier + CSRF state
# (mission-sso-saml-oidc-gateway). rand_core was previously dev-only;
# the SSO handlers run in production and need cryptographic randomness.
rand_core = { version = "0.6", features = ["getrandom"] }
bergshamra-dsig = "0.4.0"
bergshamra-keys = "0.4.0"

# Unix-only — `kill -0 <pid>` for liveness check + `kill -TERM`
# for graceful shutdown. Targets without `unix` cfg use the
# fallback shim in handlers/gateway.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native Linux computer-use executor — only linked on Linux so
# the `#[cfg(target_os = "linux")]` blocks in
# `handlers/worker_actions_executor_cu_linux.rs` can reference
# its public types. On macOS/Windows the dispatch arm returns a
# clean Provider error without touching this crate.
[target.'cfg(target_os = "linux")'.dependencies]
argo-executor-computer-use-linux = { path = "../argo-executor-computer-use-linux" }

# Native Windows computer-use executor — only linked on Windows so
# the `#[cfg(target_os = "windows")]` blocks in
# `handlers/worker_actions_executor_cu_windows.rs` can reference
# its public types. On macOS/Linux the dispatch arm returns a
# clean Provider error without touching this crate.
[target.'cfg(target_os = "windows")'.dependencies]
argo-executor-computer-use-windows = { path = "../argo-executor-computer-use-windows" }

[features]
default = []
# Pass-through to argo-voice-tui's whisper-native feature: enables
# native mic capture (cpal) + whisper.cpp STT for `argo voice`.
# Heavy native build — see crates/argo-voice-tui/Cargo.toml for
# the cost.
whisper-native = ["argo-voice-tui/whisper-native"]

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"
# Used by `self_update` handler tests to mint ephemeral Ed25519
# keypairs that sign/verify test fixtures (no real release key in CI).
rand_core = { version = "0.6", features = ["getrandom"] }
