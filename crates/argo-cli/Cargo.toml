[package]
name = "argo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — `argo` binary"

[[bin]]
name = "argo"
path = "src/main.rs"

[dependencies]
argo-agent-runner = { path = "../argo-agent-runner", version = "0.0.1" }
argo-audit = { path = "../argo-audit", version = "0.0.1" }
argo-orchestrator = { path = "../argo-orchestrator", version = "0.0.1" }
argo-runtime = { path = "../argo-runtime", version = "0.0.1" }
argo-workflow = { path = "../argo-workflow", version = "0.0.1" }
argo-capability = { path = "../argo-capability", version = "0.0.1" }
argo-channels = { path = "../argo-channels", version = "0.0.1" }
argo-config = { path = "../argo-config", version = "0.0.1" }
argo-cron = { path = "../argo-cron", version = "0.0.1" }
argo-eval = { path = "../argo-eval", version = "0.0.1" }
argo-marketplace = { path = "../argo-marketplace", version = "0.0.1" }
argo-mcp = { path = "../argo-mcp", version = "0.0.1" }
argo-memory = { path = "../argo-memory", version = "0.0.1" }
argo-provider = { path = "../argo-provider", version = "0.0.1" }
argo-routing = { path = "../argo-routing", version = "0.0.1" }
argo-skill = { path = "../argo-skill", version = "0.0.1" }
argo-sandbox = { path = "../argo-sandbox", version = "0.0.1" }
argo-store = { path = "../argo-store", version = "0.0.1" }
argo-telemetry = { path = "../argo-telemetry", version = "0.0.1" }
argo-tool = { path = "../argo-tool", version = "0.0.1" }
argo-tui = { path = "../argo-tui", version = "0.0.1" }
argo-types = { path = "../argo-types", version = "0.0.1" }
argo-vertical = { path = "../argo-vertical", version = "0.0.1" }
argo-executor-computer-use = { path = "../argo-executor-computer-use", version = "0.0.1" }
argo-executor-document = { path = "../argo-executor-document", version = "0.0.1" }
argo-executor-filesystem = { path = "../argo-executor-filesystem", version = "0.0.1" }
argo-genesis = { path = "../argo-genesis", version = "0.0.1" }
argo-identity = { path = "../argo-identity", version = "0.0.1" }
async-trait = { workspace = true }
aws-config = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
flate2 = "1"
tar = "0.4"
# Used by `argo vertical install` (#675) to extract `.tar`
# sources into a temp dir before recursing through the
# directory-source code path.
tempfile = "3"
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Unix-only — `kill -0 <pid>` for liveness check + `kill -TERM`
# for graceful shutdown. Targets without `unix` cfg use the
# fallback shim in handlers/gateway.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
csv = "1"
tempfile = "3"
