[package]
name = "argo-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — telemetry span + metric taxonomy (§18)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
# `[telemetry.log_shipping]` HTTP-target Layer
# (`crate::http_target`). Available in default builds — the
# Layer is opt-in at runtime via `[telemetry.log_shipping].enabled`,
# not at compile time.
reqwest = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

# OTLP exporter — optional, gated on the `otlp` feature. Default off
# so the single-binary distribution stays zero-deps. Pinned to the
# 0.27 series of the opentelemetry crates (the three crates are
# released as a coordinated set and must match).
opentelemetry = { version = "0.27", optional = true, default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.27", optional = true, default-features = false, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", optional = true, default-features = false, features = ["http-proto", "reqwest-client", "trace", "metrics"] }
# Bridge from the `tracing` ecosystem (`#[instrument]` etc.) to the
# OpenTelemetry tracer registered by `otlp_exporter::init()`. Pinned
# to the 0.28 series to match `opentelemetry 0.27`.
tracing-opentelemetry = { version = "0.28", optional = true, default-features = false }

[dev-dependencies]
# Used by `nested_spans_change_current_span` to install a `Registry`
# subscriber so `tracing::Span::current().id()` returns Some(...);
# also by the `http_target` smoke + unit tests.
wiremock = "0.6"

[features]
# Enables the OTLP exporter wiring in `otlp_exporter.rs` and the
# `tracing-opentelemetry` bridge in `otlp_bridge.rs`. Off by default;
# when on, callers are expected to call
# `argo_telemetry::otlp_exporter::init()` once on process start and
# install the layer returned by `otlp_bridge::otlp_layer()` on their
# `tracing-subscriber` registry.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
