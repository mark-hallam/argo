[package]
name = "argo-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — memory store with content-addressed entries + locks (§14)"

[dependencies]
argo-types = { path = "../argo-types", version = "0.0.1" }
argo-store = { path = "../argo-store", version = "0.0.1" }
argo-identity = { path = "../argo-identity", version = "0.0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sqlite-vec = { workspace = true }
async-trait = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[features]
default = []
# Enables the Dreams API backend for memory summary tier
# (claude-dreams-memory-summarize). Compiles in the dreams_backend
# module + its types. Default-off until the Dreams API endpoint is
# generally available + per-worker daily-cap policy is approved.
dreams-backend = ["dep:async-trait", "dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true }
proptest = { workspace = true }
tempfile = "3"
# Bench-only — `compose_context` p50/p95/p99 latency harness
# (claude-bench-memory-query-perf).
criterion = { workspace = true }

[[bench]]
name = "query_perf"
harness = false
