[package]
name = "argo-executor-computer-use"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo Stream B — ComputerUseExecutor + E2B sandbox driver for the Anthropic computer-use loop"

[dependencies]
argo-config = { path = "../argo-config", version = "0.0.1" }
async-trait = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
argo-types = { path = "../argo-types" }
argo-skill = { path = "../argo-skill" }
argo-store = { path = "../argo-store", version = "0.0.1" }

[features]
# Re-exports the offline `testing` module so downstream crates
# (e.g. future vertical-template integration tests) can reuse
# `MockAnthropic` + `MockE2bClient` without rolling their own
# scripted stubs. Always on inside `cargo test` for this crate.
test-harness = []

[dev-dependencies]
# Self path-dep with `test-harness` enabled so integration tests
# in `tests/` see `pub mod testing` (which is gated behind the
# feature in production builds).
argo-executor-computer-use = { path = ".", features = ["test-harness"] }
tempfile = "3"
uuid = { workspace = true }
