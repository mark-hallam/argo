[package]
name = "argo-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — tool registry + in-core tools (§9, Phase 3 baseline + Hermes-parity additions)"

[dependencies]
argo-types = { path = "../argo-types", version = "0.0.1" }
argo-capability = { path = "../argo-capability", version = "0.0.1" }
argo-identity = { path = "../argo-identity", version = "0.0.1" }
argo-memory = { path = "../argo-memory", version = "0.0.1" }
argo-sandbox = { path = "../argo-sandbox", version = "0.0.1" }
argo-store = { path = "../argo-store", version = "0.0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "time", "io-util", "macros"] }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
# #723 — real web_search + web_extract. reqwest is the same client
# the provider transports already use; scraper is the lightest mature
# Rust HTML parser (built on Servo's html5ever).
reqwest = { workspace = true }
scraper = "0.20"
# Transitive of `scraper` but our readability walker needs its
# `NodeRef` / `NodeId` types in function signatures, so it's a
# direct dep too.
ego-tree = "0.6"
# `code_execute` stages source + side-cars in a fresh tempdir per
# call; tempfile is the same crate the dev tests use.
tempfile = "3"
# Stable string IDs for `process_registry` entries. We use UUIDv7
# (already enabled workspace-wide) instead of v4 — same uniqueness
# guarantee plus time-ordering, which is friendlier when listing
# active processes.
uuid = { workspace = true }

# `process_registry::kill` sends SIGTERM via libc::kill on Unix
# before falling back to tokio's SIGKILL on the grace timeout.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
# Captured-HTML fixtures live under `tests/fixtures/`; no live HTTP
# is hit in CI. The opt-in live tests (gated on `ARGO_LIVE_WEB=1`)
# go through reqwest directly — no mock-server crate needed.
# `session_search` integration + unit tests seed an in-memory
# `SessionStore` and need raw sqlx for the foreign-key workspace
# row insert (no public store helper for that today).
sqlx = { workspace = true }
