[package]
name = "argo-executor-computer-use-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo V1.5 — native Windows computer-use executor (UIAutomation + SendInput + BitBlt, sibling of the macOS native CU executor)"

[dependencies]
argo-executor-computer-use = { path = "../argo-executor-computer-use", version = "0.0.1" }
argo-types = { path = "../argo-types" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
] }

[dev-dependencies]
tempfile = "3"
