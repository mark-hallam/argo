[package]
name = "argo-mcp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
authors = ["Argo Engineering"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.argo-mcp]
path = ".."

[[bin]]
name = "jsonrpc_request"
path = "fuzz_targets/jsonrpc_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonrpc_response"
path = "fuzz_targets/jsonrpc_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "call_tool_result"
path = "fuzz_targets/call_tool_result.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[workspace]
members = ["."]
