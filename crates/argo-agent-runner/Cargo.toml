[package]
name = "argo-agent-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — reusable multi-turn agent loop driver (live `run_turn` against a SessionStore)"

[dependencies]
argo-config = { path = "../argo-config" }
argo-audit = { path = "../argo-audit" }
argo-capability = { path = "../argo-capability" }
argo-identity = { path = "../argo-identity" }
argo-mcp = { path = "../argo-mcp" }
argo-memory = { path = "../argo-memory" }
argo-orchestrator = { path = "../argo-orchestrator" }
argo-provider = { path = "../argo-provider" }
argo-routing = { path = "../argo-routing" }
argo-runtime = { path = "../argo-runtime" }
argo-skill = { path = "../argo-skill" }
argo-store = { path = "../argo-store" }
argo-telemetry = { path = "../argo-telemetry" }
argo-tool = { path = "../argo-tool" }
argo-types = { path = "../argo-types" }
argo-vertical = { path = "../argo-vertical" }
argo-workplace-knowledge = { path = "../argo-workplace-knowledge" }
# Promoted from dev-dependencies: the production workflow-runner adapters
# (`workflow_adapters.rs`) implement argo-workflow's ToolDispatcher /
# WorkflowAuditEmitter / WorkflowCapabilityChecker seams, so the lib (not
# just tests) needs it. argo-workflow deps only argo-types → no cycle.
argo-workflow = { path = "../argo-workflow" }
async-trait = { workspace = true }
aws-config = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = "0.6"
