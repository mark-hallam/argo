# zero-caller-allowed: Agent Client Protocol (ACP) server library — consumed by
# external ACP clients (VS Code / Cursor / Zed / JetBrains / Copilot CLI).
# Intentionally PARKED / DEFERRED-v1.x per DEC-047 (operator-decided 2026-06-10):
# complete + surface-pinned, but the `argo acp serve` CLI wire is deliberately
# NOT added — editor/IDE integration is out of paying-ready-sprint scope and
# wiring it would add an externally-reachable surface to secure for zero current
# users. Do NOT wire and do NOT delete; un-park only per DEC-047 §3.
[package]
name = "argo-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — Agent Client Protocol server (§28.Y) (standalone ACP library; not wired to a compile-time workspace consumer in v1)"

[dependencies]
argo-capability = { path = "../argo-capability" }
argo-types = { path = "../argo-types" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
