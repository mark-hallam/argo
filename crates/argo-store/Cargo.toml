[package]
name = "argo-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — SQLite + FTS5 session store"

[dependencies]
argo-types = { path = "../argo-types", version = "0.0.1" }
argo-runtime = { path = "../argo-runtime", version = "0.0.1" }
argo-security = { path = "../argo-security", version = "0.0.1" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# BYOK (mission-byok-enterprise-tenants) — cloud-KMS unwrap of the
# wrapped data-encryption-key (DEK). All three providers speak
# HTTP/JSON to their respective KMS endpoints (REST for GCP +
# Azure; AWS KMS uses the JSON-1.1 wire format). reqwest + base64
# are pulled only when at least one `kms-*` feature is enabled.
reqwest = { workspace = true, optional = true }
base64 = { version = "0.22", optional = true }

# Marker feature for at-rest encryption (Stream
# `mission-encryption-at-rest-sqlcipher`). Enabling it does NOT by
# itself swap the linked SQLite driver — the stock sqlx 0.8 driver is
# pure-Rust and ignores `PRAGMA key`. The feature is the operator-
# facing toggle that downstream builds (FIPS / SQLCipher Commercial)
# can wire to a libsqlite3-sys-with-SQLCipher fork. See
# `docs/skycot/RUNBOOK.md` § "At-rest encryption".
#
# `kms-aws` / `kms-gcp` / `kms-azure` (mission-byok-enterprise-tenants)
# each compile in one cloud KMS unwrap path. They are additive — a
# build can enable any subset without pulling SDKs for the others.
[features]
default = []
sqlcipher = []
kms = ["dep:reqwest", "dep:base64"]
kms-aws = ["kms"]
kms-gcp = ["kms"]
kms-azure = ["kms"]

[[bench]]
name = "memory_store"
harness = false

[[bench]]
name = "batched_message_write"
harness = false

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
criterion = { workspace = true }
# HTTP-level mocking for the KMS provider unit tests
# (mission-byok-enterprise-tenants). Wiremock intercepts the
# production reqwest calls via a configurable endpoint override,
# so no real-cloud calls happen in CI.
wiremock = "0.6"
