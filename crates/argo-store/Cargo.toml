[package]
name = "argo-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — SQLite + FTS5 session store"

[dependencies]
argo-types = { path = "../argo-types" }
argo-runtime = { path = "../argo-runtime" }
argo-security = { path = "../argo-security" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# BYOK (mission-byok-enterprise-tenants) — cloud-KMS unwrap of the
# wrapped data-encryption-key (DEK). All three providers speak
# HTTP/JSON to their respective KMS endpoints (REST for GCP +
# Azure; AWS KMS uses the JSON-1.1 wire format). reqwest + base64
# are pulled only when at least one `kms-*` feature is enabled.
reqwest = { workspace = true, optional = true }
base64 = { version = "0.22", optional = true }

# Direct dep on the libsqlite3-sys instance that sqlx-sqlite already
# pulls in transitively (mission-sqlcipher-1-libsqlite3-patch). The
# crate is `optional = true` so the default unencrypted build does
# not change behavior; enabling the `bundled-sqlcipher` feature
# below flips libsqlite3-sys onto its bundled-SQLCipher C source —
# with vendored OpenSSL for cross-platform reproducibility — which
# Cargo's feature unification then applies to the same instance
# used by sqlx-sqlite, so `PRAGMA key` becomes load-bearing on
# every connection sqlx opens.
libsqlite3-sys = { workspace = true, optional = true }

# Marker feature for at-rest encryption (Stream
# `mission-encryption-at-rest-sqlcipher`). Enabling it alone does
# NOT swap the linked SQLite driver — the stock sqlx 0.8 driver is
# pure-Rust and ignores `PRAGMA key`. The feature is the operator-
# facing toggle that downstream builds (FIPS / SQLCipher Commercial)
# can wire to a libsqlite3-sys-with-SQLCipher fork. See
# `docs/skycot/RUNBOOK.md` § "At-rest encryption".
#
# `bundled-sqlcipher` (mission-sqlcipher-1-libsqlite3-patch) is the
# build-time companion that actually links the SQLCipher engine via
# libsqlite3-sys' bundled C source + vendored OpenSSL. It implies
# `sqlcipher` so the marker stays consistent. Default unencrypted
# builds remain unchanged; existing unencrypted-DB paths keep
# working when the feature is enabled (SQLCipher reads a database
# with no `PRAGMA key` as plaintext).
#
# `kms-aws` / `kms-gcp` / `kms-azure` (mission-byok-enterprise-tenants)
# each compile in one cloud KMS unwrap path. They are additive — a
# build can enable any subset without pulling SDKs for the others.
[features]
default = []
sqlcipher = []
bundled-sqlcipher = [
    "sqlcipher",
    "dep:libsqlite3-sys",
    "libsqlite3-sys/bundled-sqlcipher-vendored-openssl",
]
kms = ["dep:reqwest", "dep:base64"]
kms-aws = ["kms"]
kms-gcp = ["kms"]
kms-azure = ["kms"]

[[bench]]
name = "memory_store"
harness = false

[[bench]]
name = "batched_message_write"
harness = false

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
criterion = { workspace = true }
# HTTP-level mocking for the KMS provider unit tests
# (mission-byok-enterprise-tenants). Wiremock intercepts the
# production reqwest calls via a configurable endpoint override,
# so no real-cloud calls happen in CI.
wiremock = "0.6"
