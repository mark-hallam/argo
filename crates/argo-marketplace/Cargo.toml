[package]
name = "argo-marketplace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — workspace OCI bundle push/pull (§23)"

[dependencies]
argo-types = { path = "../argo-types", version = "0.0.1" }
