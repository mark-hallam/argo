chrono = { workspace = true }
tar = "0.4"
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
tracing = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
