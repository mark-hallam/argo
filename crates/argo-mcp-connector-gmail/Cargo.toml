[package]
name = "argo-mcp-connector-gmail"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo MCP connector for Gmail search, read, draft, send, and label tools"

[[bin]]
name = "argo-mcp-connector-gmail"
path = "src/main.rs"

[dependencies]
argo-mcp = { path = "../argo-mcp", version = "0.0.1" }
argo-types = { path = "../argo-types", version = "0.0.1" }
async-trait = { workspace = true }
base64 = "0.22"
oauth2 = { version = "4.4", default-features = false, features = ["reqwest"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
