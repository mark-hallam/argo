# zero-caller-allowed: MCP connector subprocess (polyglot core invariant)
[package]
name = "argo-mcp-connector-gmail"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo MCP connector for Gmail search, read, draft, send, and label tools"

[[bin]]
name = "argo-mcp-connector-gmail"
path = "src/main.rs"

[dependencies]
argo-config = { path = "../argo-config" }
argo-mcp = { path = "../argo-mcp" }
argo-types = { path = "../argo-types" }
async-trait = { workspace = true }
base64 = "0.22"
oauth2 = { version = "4.4", default-features = false, features = ["reqwest"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
