[package]
name = "argo-config"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — argo.toml config loader (§3 + the v0.2 [budget] / [loop] additions)"

[dependencies]
argo-types = { path = "../argo-types" }
argo-core = { path = "../argo-core" }
argo-credentials = { path = "../argo-credentials" }
# OS-keyring backend (mission-system-keyring-integration) — explicit
# per-platform features so default-off still pulls macOS Keychain /
# Windows Credential Manager / Linux Secret Service.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
# Per-tenant SQLCipher key resolution (mission-sqlcipher-2-keyring-wire).
# base64 for the canonical env-var / keyring wire format; rand_core for
# OS-randomness when generating fresh keys; secrecy for zero-on-drop
# secret holding (same crate already pulled transitively via age-core).
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
secrecy = "0.10"
hex = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
