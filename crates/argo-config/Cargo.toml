[package]
name = "argo-config"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — argo.toml config loader (§3 + the v0.2 [budget] / [loop] additions)"

[dependencies]
argo-types = { path = "../argo-types", version = "0.0.1" }
argo-core = { path = "../argo-core", version = "0.0.1" }
argo-credentials = { path = "../argo-credentials", version = "0.0.1" }
# OS-keyring backend (mission-system-keyring-integration) — explicit
# per-platform features so default-off still pulls macOS Keychain /
# Windows Credential Manager / Linux Secret Service.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
hex = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
