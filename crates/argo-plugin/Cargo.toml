# zero-caller-allowed: plugin SDK + test scaffolding — consumed by external plugin authors
[package]
name = "argo-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Argo — plugin protocol + subprocess host (§11)"

[dependencies]
argo-config = { path = "../argo-config" }
argo-types = { path = "../argo-types" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "macros", "sync", "time"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
parking_lot = { workspace = true }
tempfile = "3"

[[bin]]
name = "argo-test-plugin-echo"
path = "tests/fixtures/echo_plugin.rs"
test = false
