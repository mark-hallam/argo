[workspace]
resolver = "2"
members = [
  "crates/argo-types",
  "crates/argo-agent-runner",
  "crates/argo-config",
  "crates/argo-store",
  "crates/argo-capability",
  "crates/argo-provider",
  "crates/argo-tool",
  "crates/argo-memory",
  "crates/argo-skill",
  "crates/argo-cron",
  "crates/argo-channels",
  "crates/argo-delegate",
  "crates/argo-sandbox",
  "crates/argo-plugin",
  "crates/argo-mcp",
  "crates/argo-mcp-connector-slack",
  "crates/argo-gateway",
  "crates/argo-cli",
  "crates/argo-tui",
  "crates/argo-audit",
  "crates/argo-telemetry",
  "crates/argo-eval",
  "crates/argo-core",
  "crates/argo-acp",
  "crates/argo-routing",
  "crates/argo-judge",
  "crates/argo-forge",
  "crates/argo-replay",
  "crates/argo-marketplace",
  "crates/argo-identity",
  "crates/argo-vertical",
  "crates/argo-executor-computer-use",
  "crates/argo-executor-filesystem",
  "crates/argo-genesis",
  "crates/argo-mcp-connector-slack",
  "crates/argo-mcp-connector-gcal",
  "crates/argo-mcp-connector-hubspot",
  "crates/argo-mcp-connector-jira",
  "crates/argo-mcp-connector-linear",
  "crates/argo-mcp-connector-notion",
  "crates/argo-mcp-connector-gmail",
  "crates/argo-mcp-connector-asana",
  "crates/argo-mcp-connector-airtable",
  "crates/argo-mcp-connector-salesforce",
  "crates/argo-mcp-connector-stripe",
  "crates/argo-mcp-connector-monday",
  "crates/argo-orchestrator",
  "crates/argo-workflow",
  "mcp-servers/voice",
  "mcp-servers/browser",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "LicenseRef-Proprietary"
rust-version = "1.75"
authors = ["Skycot"]
repository = "https://github.com/mark-hallam/Argo-Agent"
description = "Argo — the ship of agents"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"], default-features = false }
globset = "0.4"
proptest = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
parking_lot = "0.12"
regex = "1"
fs2 = "0.4"
ratatui = "0.28"
crossterm = "0.28"
futures = { version = "0.3", default-features = false, features = ["std"] }
sqlite-vec = "0.1.9"
# YAML frontmatter for skills (§14.2).
serde_yaml = "0.9"
# AWS Bedrock — sigv4 auth, eventstream streaming. Pulled in by argo-provider's
# BedrockTransport per Phase 2 / Agent F brief.
aws-config = "1"
aws-sdk-bedrockruntime = "1"
aws-smithy-types = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
