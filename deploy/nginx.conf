# SKYCOT gated demo — nginx: TLS + basic-auth gate + path routing.
#
# Routes /api/v1/*, /health, /inbox/ws to the gateway (loopback :7400);
# everything else to the SPA (loopback :3000). The browser only ever talks to
# this server (same-origin), so CSP 'self' covers its fetches + same-origin ws.
# Replace `try.skycot.com` with your subdomain. See DEPLOYMENT.md.

events {}

http {
  # HTTP -> HTTPS redirect.
  server {
    listen 80;
    server_name try.skycot.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name try.skycot.com;

    ssl_certificate     /etc/letsencrypt/live/try.skycot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/try.skycot.com/privkey.pem;

    # ---- THE GATE: basic-auth on everything (private but pointable) ----
    auth_basic           "SKYCOT — private preview";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 25m;   # voice audio uploads (base64) can be chunky

    # API + health -> the gateway (loopback, demo-bypass mode).
    location /api/ {
      proxy_pass         http://127.0.0.1:7400;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;   # LLM pitch answers can take a while
    }
    location = /health {
      proxy_pass http://127.0.0.1:7400;
    }

    # Live approvals WebSocket -> the gateway, with upgrade headers.
    location /inbox/ {
      proxy_pass         http://127.0.0.1:7400;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 3600s;
    }

    # Everything else -> the SPA (Next standalone).
    location / {
      proxy_pass       http://127.0.0.1:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
