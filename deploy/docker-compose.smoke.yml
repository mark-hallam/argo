# SKYCOT K5 deployment smoke stack — CI/dev variant of the canonical stack.
#
# This is NOT a second deploy stack: it builds the SAME canonical images as
# deploy/docker-compose.yml (deploy/Dockerfile.gateway + deploy/Dockerfile.web),
# so the smoke always exercises the REAL gateway — bundled truth-boundary
# policies + pitch corpus + provider manifests, Rust 1.83. (It replaces the
# removed legacy single-machine stack, whose gateway image built a policy-less
# Rust-1.75 gateway with no truth-boundary policies — see WS5 consolidation.)
#
# Why a separate file from deploy/docker-compose.yml: the canonical compose is
# the gated-demo topology (host networking + nginx:443 basic-auth + Let's
# Encrypt TLS), which the API-level smoke can't drive (no certs in CI, gateway
# on loopback 127.0.0.1:7400). This file instead exposes the gateway + SPA on
# host ports 8080/3000 for curl-equivalent checks, and overrides the canonical
# gateway CMD to bind 0.0.0.0:8080 (--insecure-bind) so checks.ts can reach it.
# Auth ceremony is bypassed via deploy/smoke/.env.smoke (ARGO_GATEWAY_AUTH_BYPASS=1).
#
# Driven by deploy/smoke/run.sh (and the disabled deploy-smoke.yml workflow):
#   bash deploy/smoke/run.sh
#
# Services:
#   postgres — scaffold for the future postgres-backed store (argo uses SQLite
#              via the argo-data volume today; harmless if argo doesn't connect).
#   gateway  — the canonical argo gateway image, bound 0.0.0.0:8080 for the smoke.
#   web      — the canonical Next.js SPA image, HOSTNAME=0.0.0.0 so the host
#              port mapping is reachable.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argo
      POSTGRES_DB: argo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.smoke}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argo -d argo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Intentionally NOT exposed externally — reachable only on the compose
    # network at `postgres:5432`.

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: argo:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARGO_GATEWAY_BEARER_TOKEN: ${ARGO_GATEWAY_BEARER_TOKEN:?ARGO_GATEWAY_BEARER_TOKEN must be set in .env.smoke}
      # Auth bypass is the documented smoke escape hatch (see deploy/smoke/README.md
      # "Auth bypass — CI ONLY"). It must reach the gateway PROCESS, not just the
      # --env-file: forwarding it here (a) frees the smoke of bearer-token ceremony
      # and (b) disables the production JWT-secret boot guard (startup_check.rs
      # jwt_guard_active), which otherwise exit-78s a non-loopback bind that has no
      # SKYCOT_AUTH_JWT_SECRET. NEVER set this in production.
      ARGO_GATEWAY_AUTH_BYPASS: ${ARGO_GATEWAY_AUTH_BYPASS:-1}
      DATABASE_URL: ${DATABASE_URL:-postgres://argo:${POSTGRES_PASSWORD}@postgres:5432/argo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARGO_TENANT_DEFAULT: ${ARGO_TENANT_DEFAULT:-default}
      ARGO_LOG_LEVEL: ${ARGO_LOG_LEVEL:-info}
      # CI-ONLY throwaway encrypted-store key (see .env.smoke). Production mode
      # requires a SQLCipher-linked binary + non-none key_source; the gateway
      # exits 1 at boot without it. Forwarded to the container PROCESS (the
      # --env-file only drives compose substitution, not the container env).
      SKYCOT_DB_KEY_BASE64: ${SKYCOT_DB_KEY_BASE64:?SKYCOT_DB_KEY_BASE64 must be set in .env.smoke}
    volumes:
      - argo-data:/data
    ports:
      # Host port is parameterized (SMOKE_GATEWAY_PORT, default 8080) so a smoke
      # run can dodge a host-port collision — e.g. a dev gateway/SPA already bound.
      # Container port stays 8080 (matches the --port below).
      - "${SMOKE_GATEWAY_PORT:-8080}:8080"
    # The canonical image's CMD binds 127.0.0.1:7400 (loopback, nginx-fronted).
    # For the host-port-exposed smoke we override to 0.0.0.0:8080. A non-loopback
    # bind requires the two-flag override --bind-non-loopback
    # --accept-insecure-bind-warning (the old single --insecure-bind flag is now
    # rejected at runtime; see cmd_dispatch::resolve_non_loopback_override). argo
    # ships without TLS and the smoke is behind no public ingress, so the override
    # is the intended path here. Policies/corpus stay bundled from the image.
    command:
      ["argo", "gateway", "start", "--bind", "0.0.0.0", "--port", "8080", "--bind-non-loopback", "--accept-insecure-bind-warning"]
    # `argo gateway probe live` is the in-binary K8s-style probe already in the
    # image (the slim runtime ships no curl). Web's depends_on uses this.
    healthcheck:
      test: ["CMD", "argo", "gateway", "probe", "live", "--port", "8080"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: argo-web:dev
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      # Canonical web image bakes HOSTNAME=127.0.0.1 (loopback, behind nginx).
      # Override to 0.0.0.0 so the host port mapping below is reachable.
      HOSTNAME: "0.0.0.0"
    ports:
      # Host port is parameterized (SMOKE_SPA_PORT, default 3000) so a smoke run
      # can dodge a host-port collision — e.g. a dev SPA already bound on :3000.
      # Container port stays 3000.
      - "${SMOKE_SPA_PORT:-3000}:3000"

volumes:
  pg-data:
  argo-data:
