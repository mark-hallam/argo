# nginx site config for the SKYCOT single-VM deployment.
#
# Installed at /etc/nginx/sites-available/skycot and symlinked from
# sites-enabled/. Reverse-proxies the web SPA on / and the argo gateway
# under /api/. Both upstream services bind to 127.0.0.1 — nginx is the
# only public listener.
#
# On HTTP-only installs (no --with-tls flag) the `server { listen 80 }`
# block below answers traffic directly. When the operator runs
# `certbot --nginx -d <domain>`, certbot rewrites this file in-place to:
#   - replace `listen 80 default_server;` with an HTTP→HTTPS redirect
#   - add a `server { listen 443 ssl http2; }` block that includes the
#     issued cert and reuses the same `location` blocks below
# Do NOT hand-edit a 443 block here — let certbot manage it so renewals
# don't conflict with operator edits.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Client uploads (signed-url manifests etc.) — keep generous but
    # bounded so the gateway doesn't ingest unbounded blobs.
    client_max_body_size 10M;

    # Basic security headers. CSP is intentionally minimal here — the
    # SPA's own meta tags refine it. HSTS is gated on TLS being present
    # (no point declaring HSTS over plain HTTP), so certbot adds it
    # when rewriting this file for the 443 server block.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: wss:" always;

    # Argo gateway — strip the /api prefix before forwarding. The
    # trailing slash on proxy_pass is load-bearing: it tells nginx to
    # rewrite /api/v1/health → /api/v1/health (after stripping /api).
    # Actually argo's routes already live under /api/v1/, so we forward
    # the full path 1:1; the trailing slash style remains for symmetry
    # with the documented forwarding semantics below.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket upgrade for the approvals-inbox live tier
    # (/api/v1/inbox/ws). Requires HTTP/1.1 plus the Upgrade/Connection
    # headers; the long read timeout keeps idle sockets alive between
    # ping frames.
    location /api/v1/inbox/ws {
        proxy_pass http://127.0.0.1:8080/api/v1/inbox/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Web SPA — everything else.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
