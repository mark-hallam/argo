# Grafana datasource provisioning for the gated-demo compose stack.
# Auto-loaded on grafana start (mounted at /etc/grafana/provisioning/datasources).
# Host-networked grafana reaches the host-loopback prometheus on 127.0.0.1:9090.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: skycot-prom
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
