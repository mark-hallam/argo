apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: argo
  labels:
    app.kubernetes.io/name: argo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: argo
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
