# EXAMPLE — DO NOT APPLY THIS FILE DIRECTLY.
#
# This file documents the shape of the Secret the argo Deployment expects.
# The base kustomization.yaml DOES NOT include it, so `kubectl apply -k` will
# never ship these placeholder values to a cluster.
#
# To create the real Secret on your cluster, prefer:
#
#   kubectl create secret generic argo-secret \
#     --from-literal=ARGO_GATEWAY_BEARER_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="postgres://argo:CHANGEME@postgres:5432/argo" \
#     --from-literal=ANTHROPIC_API_KEY="..." \
#     --from-literal=OPENAI_API_KEY="..."
#
# Or copy this file, replace the placeholders with real base64-encoded
# values, and apply that copy out-of-band (and KEEP IT OUT OF GIT).
apiVersion: v1
kind: Secret
metadata:
  name: argo-secret
  labels:
    app.kubernetes.io/name: argo
type: Opaque
data:
  # echo -n '<value>' | base64
  ARGO_GATEWAY_BEARER_TOKEN: PGJhc2U2NC1lbmNvZGVkLXRva2VuPg==
  DATABASE_URL: PGJhc2U2NC1lbmNvZGVkLXBvc3RncmVzLXVybD4=
  # Optional provider keys; leave blank or omit if unused.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
