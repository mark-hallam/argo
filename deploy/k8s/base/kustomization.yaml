apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/part-of: skycot

resources:
  - argo-configmap.yaml
  - argo-pvc.yaml
  - argo-deployment.yaml
  - argo-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml

# argo-secret.example.yaml is intentionally NOT listed. Operators create the
# real Secret out-of-band (kubectl create secret …). See README §"Secrets".
