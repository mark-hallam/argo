apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  # Headless service: gives the StatefulSet stable DNS records
  # (postgres-0.postgres.<ns>.svc.cluster.local) without round-robin VIP.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - name: pg
      port: 5432
      targetPort: pg
      protocol: TCP
