[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Explicit deny-list of crate names. Used when policy forbids a
# specific crate (e.g. `openssl` when the project is `ring`-only).
deny = [
    { crate = "openssl", reason = "prefer rustls-backed TLS dependencies" },
    { crate = "git2", reason = "libgit2 FFI is not part of the approved supply-chain profile; prefer pure-Rust gix" },
]
skip = [
    # cargo-deny sees path-only workspace deps as `*`; keep registry
    # wildcards denied while skipping those internal package nodes.
    { crate = "argo-acp", reason = "workspace path crate; skip cargo-deny public-path wildcard false positive" },
    { crate = "argo-agent-runner", reason = "workspace path crate; skip cargo-deny public-path wildcard false positive" },
