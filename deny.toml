[graph]
all-features = false

# Tighten policy edits go through PR review. Adding to `allow = [...]`
# or `skip = [...]` is a stand-alone PR with justification in the
# commit message. Don't `*` anything.
#
# cargo-deny is the workspace supply-chain / license / advisory gate.
# The 4 check kinds (advisories, bans, licenses, sources) run as a
# matrix from `.github/workflows/deny.yml.disabled` and locally via
# `scripts/cargo-deny.sh`. See `docs/skycot/security/dep-policy.md`
# for the policy and `docs/skycot/runbook/cargo-deny.md` for the
# command-level troubleshooting guide.

[advisories]
yanked = "deny"
unused-ignored-advisory = "warn"
# Allowlist of accepted RUSTSEC advisory IDs. Every entry is a known
# risk the operators have explicitly chosen to accept. Add via the
# process documented in `docs/skycot/security/dep-policy.md`:
# security review + 2 business day soak + comment link to discussion.
# NO blanket ignores.
#
# Ignore advisories that are real but currently have no patched
# release upstream — re-evaluate when the upstream cuts a fix.
ignore = [
    # `paste` — unmaintained as of 2024-10. Pulled in transitively
    # by ratatui (proc-macro convenience). No drop-in replacement
    # ratatui can adopt today; the advisory is informational, not
    # a vulnerability.
    "RUSTSEC-2024-0436",
    # rustls-webpki 0.103.x — three advisories from April 2026.
    # Latest stable is 0.103.13; the patches are in 0.104.0-alpha.
    # All three are name-constraint / CRL parsing issues that
    # don't affect Argo's use-case (we don't accept user-supplied
    # certs or CRLs; reqwest only validates the provider TLS chain).
    # Re-check on the next 0.103.x point release.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    { id = "RUSTSEC-2023-0071", reason = "rsa timing side-channel advisory has no patched release; current reachability is document-signing dependencies, not exposed private-key service operations. Track dependency replacement in follow-up." },
    { id = "RUSTSEC-2024-0437", reason = "protobuf is pulled by prometheus 0.13; no dependency bump in this policy brief. Follow up by upgrading prometheus/protobuf or proving parser input is trusted." },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is an unmaintained transitive dependency; no vulnerability reported. Follow up through the reverse dependency rather than changing deps in this policy brief." },
    { id = "RUSTSEC-2026-0002", reason = "lru unsound IterMut advisory is in argo-mcp cache plumbing; this brief does not bump dependencies. Follow up with lru >=0.16.3 or remove IterMut reachability." },
    { id = "RUSTSEC-2026-0141", reason = "lettre boring-tls hostname-verification bug; Argo should upgrade to lettre >=0.11.22 in a dependency brief. This policy brief records the accepted short-term exception." },
]

[licenses]
# Operator-approved license set for workspace dependencies. Any
# dependency carrying a license outside this list will fail the
# `licenses` check. Add new licenses only via the process in
# `docs/skycot/security/dep-policy.md`.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
unused-license-exception = "allow"
exceptions = [
    # Internal workspace crates inherit `LicenseRef-Proprietary`.
    # Third-party dependencies still have to match `[licenses].allow`.
    { crate = "argo-acp", allow = ["LicenseRef-Proprietary"] },
