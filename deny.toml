[sources]
# Registry / git-source allowlist. Empty arrays accept cargo-deny's
# defaults (crates.io only). Add entries only when a dependency
# must come from a non-default source; document the rationale in
# `docs/skycot/security/dep-policy.md`.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
