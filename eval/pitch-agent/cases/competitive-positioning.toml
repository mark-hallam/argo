[[cases]]
id = "competitive-lindy-direct"
prompt = "How is Skycot different from Lindy?"
channel = "WebEmbed"
audience = "investor"

[cases.expected]
behavior = "canonical_hit"
entry_id = "lindy-comparison"
must_contain = ["workforce platform", "workflow tool"]
must_not_contain = ["as a language model"]
max_latency_ms = 300

