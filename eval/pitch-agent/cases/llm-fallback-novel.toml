# LLM-fallback novel-question cases — exercises the
# pitch-agent-llm-with-truth-boundary-gating brief's promise that
# novel questions outside the canonical-Q&A corpus get routed to a
# truth-boundary-gated LLM draft.
#
# Each case here either:
#   1. Asserts the deterministic policy disposition that the LLM draft
#      will be re-scored against (claim_blocked / claim_escalated), or
#   2. Asserts that an off-topic novel question carries Allow under
#      the policy (canonical_miss_allow) — the LLM draft itself is
#      generative, but the policy gate is deterministic and pinned
#      here.
#
# These cases complement the 111 pre-existing canonical-QA cases
# rather than replace them. The pre-existing cases pin the hot-path
# (sub-millisecond canonical lookup). These pin the cold-path policy
# gate that fires on every LLM draft.

# ── Novel allow — questions a real LLM should answer freely ─────────

[[cases]]
id = "llm-allow-team-culture"
prompt = "What kind of engineering culture do you have?"
channel = "WebEmbed"
audience = "investor"

[cases.expected]
behavior = "canonical_miss_allow"
must_contain = ["Skycot"]

